id: cardpoint-lookup
facts:
  - id: F1
    value: "여신금융협회 카드포인트 통합조회·계좌입금 자주 묻는 질문(https://www.cardpoint.or.kr/page/faq)을 2026-11-28에 열었다. 인용: \"카드회원이 카드 포인트를 보다 쉽게 조회하고 현금화 가능 포인트에 대해 일괄 계좌입금 신청할 수 있도록 카드업계가 공동 개발・운영하는 서비스\". \"외국인을 포함한 신용카드사 등의 개인회원에 한해 이용할 수 있으며, 법인회원은 이용할 수 없습니다.\" 홈페이지 www.cardpoint.or.kr, 모바일 m.cardpoint.or.kr. \"구글플레이 스토어에서 ‘카드포인트조회’ 앱을 무료로 다운로드\" \"안드로이드 폰 전용\". 본인 인증은 \"휴대폰/카드/IPIN 인증 중 한 가지\". 비회원 순서: 통합조회&계좌입금, 비회원 조회하기, 이용약관·개인정보 동의, 본인인증 및 위임동의, 서비스 이용. 회원은 \"별도 인증 없이 카드포인트 통합조회가 가능\"하고 \"계좌입금을 위해서는 추가적인 본인인증\". 조회 \"매일 00:00~24:00시\". 계좌입금 \"매일 00:30~23:30시\", \"카드사별 1일 1회\", 점검 \"23:30~00:30시\". 현금화는 \"각 카드사별 대표 포인트\". 목록: L.POINT(롯데카드), TOP포인트(비씨카드), 보너스포인트(삼성카드), 마이신한포인트(신한카드), 위비WON꿀머니/모아포인트(우리카드), 하나머니(하나카드), H-Coin(현대카드), 포인트리(KB국민카드), NH포인트(NH농협카드), 씨티포인트(씨티카드), 우체국포인트(우체국). \"하나머니의 경우 하나카드의 예스・하나・하나멤버스 포인트가 모두 합산\". \"현대카드 M포인트는 웹/앱/상담센터를 통해 H-Coin으로 전환\" \"1M 포인트 = 2/3 H-Coin\". \"현금화 비율은 1포인트당 1원이며, 계좌입금 신청은 1포인트부터 가능\". 계좌는 \"정상 계좌로 확인된 본인 명의\". 타인 명의, 지급 정지, 압류 계좌는 불가. 입금은 \"실시간 또는 익영업일이내(카드사별로 상이)\". 차감은 \"입금 신청 완료 시점을 기준으로 즉시\". 실시간: 비씨카드, 신한카드, 우리카드, KB국민카드, NH농협카드. 현대카드 08:00~23:00시 실시간, 하나카드 06:00~22:00시 실시간. 그 밖은 \"첫 도래하는 실시간 입금 가능 신청 시간\". 익영업일: 삼성카드, 씨티카드, 우체국, 롯데카드. \"취소 및 정정이 불가\". 기한이 지나도 입금이 없으면 \"해당 카드사 고객센터에 직접 문의\". 협회는 신청 이후 입금 상황을 확인하기 어렵다고 적음. 조회 정보: 잔여 금액, 소멸예정 금액, 소멸예정 월. \"일부 제휴 포인트는 조회되지 않을 수 있습니다.\" \"유효기간은 보통 5년(60개월)\" \"1~3년 또는 무제한\". 숫자 0, 00, 1, 2, 3, 5, 6, 8, 22, 23, 24, 30, 60. 본문은 0시, 24시, 0시 30분, 23시 30분, 8시, 6시, 22시, 1점 1원, 5년, 60개월, 1년, 3년, 3분의 2, 엠포인트 1을 이 문장에서 가져온다. 08과 06은 본문에 8시, 6시로만 쓴다. 참여 카드사 '몇 곳'이라는 개수 숫자는 본문에 쓰지 않는다."
    source: "https://www.cardpoint.or.kr/page/faq"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28 오전에 FAQ 페이지 본문을 열었다. 카드사 고객센터 전화번호(1588 등)와 협회 02-2011-0700은 본문에 넣지 않는다. 홈 화면 https://www.cardpoint.or.kr/ 도 같은 시각에 열었고 제목은 카드포인트 통합조회 / 계좌입금 / 기부였다. 기부 절차 숫자는 없어 본문에 쓰지 않는다."
  - id: F2
    value: "금융위원회 2021-01-05 보도자료. ‘21.1.5일부터 여신금융협회 카드포인트 통합조회·이체 홈페이지(cardpoint.or.kr)와 금융결제원 어카운트인포 앱에서 카드 포인트를 일괄 조회한 뒤 계좌로 이체할 수 있다고 적음. 대표 포인트는 현금과 1:1, 1포인트(=1원)부터. 제휴 포인트는 통합 이체·출금 대상에서 제외. 이 보도자료의 이용시간 00:30~23:30, 어카운트인포 01:00~23:00, 20시 이후 익영업일, 대상 카드사 8개 전업과 3개 겸영(농협, 씨티, 우체국)은 출시 당시 개요다. 본문의 입금 시각은 이 개요가 아니라 F1의 현재 FAQ를 쓴다. 숫자 2021, 1, 5는 본문 '2021년 보도자료'의 2021과, 1원·1점의 1과 겹친다. 8, 3, 20, 01은 본문에 이 보도자료 개요로 쓰지 않는다."
    source: "https://www.fsc.go.kr/no010101/75079"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28에 보도자료 페이지를 열었다. 2019년 적립액·소멸률 통계는 본문에 쓰지 않는다."
  - id: F3
    value: "금융위원회 2021-01-15 보도자료. 인용: \"카드 포인트 입금 등 명목으로 수수료나 카드 비밀번호·CVC 정보 등을 요구하는 경우 보이스피싱일 가능성이 있으니 유의\". \"금결원·여신협회 카드포인트 현금화 서비스는 무료이며, 어떠한 경우에도 카드 비밀번호·CVC 정보를 요구하는 일이 없습니다.\" 대표 포인트는 현금과 1:1, 제휴 포인트는 제외. 현대카드 M포인트는 H코인으로 전환 후 현금화. 본문은 무료, 수수료·비밀번호·뒷면 숫자를 요구하지 않는다는 문장과 2021년 보도자료라는 표시만 쓴다. 778억원, 681만건 등 출시 초기 실적 숫자는 본문에 쓰지 않는다."
    source: "https://www.fsc.go.kr/no010101/75181"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28에 보도자료 페이지를 열었다. 카드사별 입금 시각은 이 글의 '20:00' '23:00' 단순 표가 아니라 F1 현재 FAQ를 본문에 썼다. 하나카드 20:00, 현대 23:00이라는 2021년 문장은 본문 시각으로 쓰지 않는다."
  - id: F4
    value: "금융위원회 2023-09-22 카드뉴스. 인용: \"여신금융협회 카드포인트 통합조회시스템 (https://www.cardpoint.or.kr/main)에서 앱 다운로드 없이 카드포인트를 조회하고 현금화 할 수 있습니다.\" \"정부, 금융기관은 카드포인트 입금 등의 이유로 수수료나 카드 비밀번호·CVC 정보 등을 요구하는 일이 절대 없습니다.\" 본문은 수수료·비밀번호·뒷면 숫자를 요구하지 않는다는 취지로만 쓰고, 2023, 9, 22는 본문에 쓰지 않는다."
    source: "https://www.fsc.go.kr/no040101?cnId=1892"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28에 카드뉴스 페이지를 열었다."
  - id: F5
    value: "금융결제원 페이인포. 내 카드 한눈에 소개: \"본인의 카드정보, 결제예정금액, 최근 이용대금, 포인트 정보를 조회하고 포인트를 현금화할 수 있는 서비스\". \"카드포인트현금화 고객이 보유하고 있는 현금화 가능한 포인트를 조회하여 본인계좌로 현금화\". 자주 묻는 질문: \"내카드 한눈에 서비스는 만 19세 이상 내국인이 이용할 수 있는 서비스로 법인, 임의단체, 해외체류자 및 외국인은 서비스 대상에서 제외\". \"카드포인트현금화 서비스는 현금화 가능한 각 카드사의 대표 포인트만 조회\". \"삼성, 씨티, 우체국카드 포인트는 익영업일에 입금되며, 롯데, 하나, 현대카드의 경우에는 신청시간에 따라 익영업일에 입금될 수 있습니다.\" \"신청 즉시 포인트는 차감\". \"취소 및 정정은 불가\". 본문은 만 19세 이상 내국인, 외국인은 협회 화면, 어카운트인포 문구가 협회 FAQ와 조금 다르다는 문장만 쓴다. 숫자 19."
    source: "https://www.payinfo.or.kr/guide/introCard.do?menu=10"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28에 소개 페이지와 https://www.payinfo.or.kr/cs/faq/qryListWebFaq.do 를 열었다. 어카운트인포의 카드사별 시각 숫자는 협회 FAQ와 문구가 달라 본문에 시각으로 옮기지 않는다. www.payinfo.or.kr 첫 화면은 같은 시각에 빈 응답이라 하위 안내 페이지를 출처로 썼다."
  - id: F6
    value: "여신금융협회 신용카드 이용 안내. 인용: \"가족카드 사용금액이 본인카드 사용금액에 합산되어 포인트가 적립\". \"본인 명의의 포인트 적립 현황을 확인하고자 하는 경우, 당 협회의 카드포인트 통합 조회&계좌입금 시스템을 이용\". 주소 https://www.cardpoint.or.kr. 가족 이름 로그인 시 별도 잔액이 보이는지는 이 페이지와 F1 자주 묻는 질문에 없다. 본문은 합산과 본인 명의, 확인 못 한 부분은 카드사 앱이라고만 적는다. 같은 페이지의 할부 20만원, 7일, 14일, 60일, 3개 카드 문장은 본문에 쓰지 않는다."
    source: "https://customer.crefia.or.kr/common/forward.xx?url=%2Fcustomer%2Fguard%2FguardCreditcardUseGuide3"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28에 이용 안내 본문을 열었다."
  - id: F7
    value: "금융감독원 신용카드 이용 안내. 가족카드 문장은 F6과 같이 \"가족카드 사용금액이 본인카드 사용금액에 합산되어 포인트가 적립\". 소멸: \"소멸예정 포인트, 소멸시기 등 포인트 소멸과 관련된 내용을 소멸 6개월 전부터 매월 이용대금명세서 등을 통해 회원에게 통지\". \"카드사의 홈페이지를 통해서도 확인\". 본문은 6개월 전부터 명세서에 알려 주고, 날짜는 카드사 앱에서 확인하라고만 적는다. 숫자 6은 F1의 6시와 이 6개월이 같이 쓴다."
    source: "https://www.fss.or.kr/fss/main/contents.do?menuNo=200499"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "2026-11-28에 안내 본문을 열었다. 2025-11-17 금융감독원 보도자료(포인트 자동사용, https://www.fss.or.kr/fss/bbs/B0000188/view.do?menuNo=200218&nttId=207410)도 열었으나 소멸액 통계와 자동사용 단위는 본문에 넣지 않는다. 소멸 예정 날짜를 단정하지 않는다."
  - id: F8
    value: "이 글을 확인한 날은 2026-11-28. 기준 표기 2026년 11월 28일. 썸네일 숫자 1원은 F1의 1포인트당 1원. 숫자 2026, 11, 28, 1."
    source: "https://www.cardpoint.or.kr/page/faq"
    checkedAt: "2026-11-28T07:50:00+09:00"
    note: "본문 확인 문장, baseDate, 출처를 연 날. 예시 계산 3,200점, 1,500점, 800점, 합 5,500원은 WorkedExample example 안이라 본문 사실 숫자로 쓰지 않는다. 여신금융협회 공시 페이지 https://gongsi.crefia.or.kr/portal/financialConInfo/cardPoint 는 같은 날 다시 열었을 때 504라, 참여 회사 개수는 본문에 쓰지 않는다."
