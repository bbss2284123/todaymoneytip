id: year-end-tax-preview
facts:
  - id: F1
    value: "2026년 귀속 연말정산 미리보기 운영 기간은 2026년 10월 28일(수)부터 12월 18일(금)까지. 배지 표기 12.18은 12월 18일. 국세청 뉴스레터 제1184호(작성 2026-10-26) 본문 이미지에 '10월 28일(수)부터 12월 18일(금)까지', '10.28 ~ 12.18'이 적혀 있다."
    source: "https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?bbsId=1022&mi=2209&nttSn=1355698"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "2026-11-20에 뉴스레터 페이지와 본문 이미지 https://www.nts.go.kr/upload/news/img/issue_1184_01.png 를 열었다. 이미지 문구에 귀속연도 숫자는 없고, 회차 작성일이 2026-10-26이다. 같은 기간이 정책브리핑(F2)에 2026.10.28.~12.18.로 적혀 있다."
  - id: F2
    value: "정책브리핑(국세청, 게시 2026-10-23). 이용 기간 2026.10.28.(수)~12.18.(금). 경로: 홈택스 → 장려금·연말정산·기부금 → 편리한 연말정산 → 연말정산 미리보기. 확인하는 것 3가지: 예상 환급액 또는 추가 납부액, 신용카드 사용에 따른 소득공제 효과, 공제 항목별 절세 정보. 입력 순서: (1) 전년도 지급명세서를 불러오고 예상 총급여와 이미 납부한 세액 입력 (2) 1~9월 카드 사용금액 확인 후 10~12월 예상 지출액 입력 (3) 주택자금·보험료·의료비·교육비 등 예상 지출액 반영 (4) 예상세액과 최근 3개년 공제금액·세액 변동 추이 확인. 예상세액은 확정 금액이 아니며 실제 소득과 지출에 따라 달라질 수 있다. 일부 카드 내역은 카드사가 제출하지 않을 수 있고, 그 자료는 2027년 1월 개통 예정인 연말정산 간소화 서비스에서 제공될 예정. 성년 자녀 공제자료는 별도 자료 제공 동의 필요."
    source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974171"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "2026-11-20에 정책브리핑 원문을 열었다. 손택스 메뉴 단계는 이 글과 뉴스레터에 없다. 과거 연도 개통일은 이 원문에 없어 본문에 넣지 않는다."
  - id: F3
    value: "2026년 달라지는 공제(같은 정책브리핑). 교육비: 직계비속 소득요건 폐지, 아르바이트하는 대학생 자녀 교육비 공제 가능. 9세 미만 또는 초등학교 2학년 이하 아동의 예능학원·체육시설 수강료 공제 가능. 고향사랑기부금: 10만 원 초과~20만 원 이하 40%, 20만 원 초과분 15%, 특별재난지역 일정 요건 충족 기부금 30%. 월세: 일정 요건의 맞벌이 부부 적용 확대, 3자녀 이상 가구는 주택 면적 기준 완화. 면적 제곱미터 숫자는 원문에 없어 본문에 넣지 않는다."
    source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974171"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "국민참여형 국민성장집합투자증권저축 소득공제율은 같은 카드에 있으나 구간 제목과 총급여 조건이 한 줄로 겹쳐 보여 숫자를 확정하지 못했다. 본문에 그 금액은 넣지 않는다."
  - id: F4
    value: "신용카드 등 소득공제 한도(같은 정책브리핑). 총급여 7,000만 원 이하 기본공제: 자녀 없음 300만 원, 자녀 1명 350만 원, 자녀 2명 이상 400만 원. 추가공제 한도 300만 원. 총급여 7,000만 원 초과 기본공제: 자녀 없음 250만 원, 자녀 1명 275만 원, 자녀 2명 이상 300만 원. 추가공제 한도 200만 원. 추가공제 한도는 전통시장·대중교통 등 특정 사용분에 별도 적용."
    source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974171"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "결제수단별 공제율(신용카드 15%, 체크카드 30% 등)은 이 카드에 없어 이 글 본문에 적지 않고 기존 글로 링크만 한다."
  - id: F5
    value: "연금계좌 세액공제. 종합소득금액 4,500만 원(총급여 5,500만 원) 이하면 세액공제 대상 납입한도 600만 원(퇴직연금 포함 900만 원), 공제율 15%. 그 금액을 넘으면 공제율 12%."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "2026-11-20에 국세청 세액공제 페이지를 열었다. 표의 초과 구간 한도 칸은 화면에서 비어 보였고, 한도 600만 원(900만 원)은 이하 구간에 적혀 있다. 초과 구간의 한도를 따로 단정하지 않고 공제율 12%만 쓴다. 지방소득세율은 이 페이지에 없어 계산에 넣지 않는다."
  - id: F6
    value: "소득세 과세기간은 1월 1일부터 12월 31일까지 1년. 소득세법 제5조. 시행 2026. 7. 1. 법률 제21221호, 2025. 12. 23. 일부개정."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1029489919"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "2026-11-20에 조문을 열었다. 관련 글 주소 pension-savings-december-31의 31은 이 과세기간 말일과 같다."
  - id: F7
    value: "가상 예시(직접 계산). 미리보기 결과가 추가납부 30만 원이라고 두고, 연금저축 300만 원을 남은 한도 안에 더 넣는다고 둔다. 총급여 5,500만 원 이하이면 300만 원 × 15% = 45만 원. 추가납부 30만 원에서 45만 원을 빼면 환급 15만 원 쪽이 된다. 총급여가 5,500만 원을 넘으면 12%라 300만 원 × 12% = 36만 원이고, 추가납부 30만 원은 환급 6만 원 쪽이 된다. 30만 원과 300만 원은 예시 입력. 지방소득세는 빼지 않았다."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "공제율은 F5. 곱셈만 직접 했다. 이미 한도를 채운 경우, 다른 공제, 산출세액이 모자란 경우는 이 예시 밖에 있다."
  - id: F8
    value: "이 글을 확인한 날은 2026-11-20. 기준일 표기 2026-11-20."
    source: "https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?bbsId=1022&mi=2209&nttSn=1355698"
    checkedAt: "2026-11-20T06:15:00+09:00"
    note: "본문 확인 문장과 baseDate의 2026, 11, 20을 원장에 둔다."
