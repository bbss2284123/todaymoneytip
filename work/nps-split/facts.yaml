id: nps-split
facts:
  - id: F1
    value: "분할연금은 배우자의 가입기간 중 혼인기간이 5년 이상이고, 이혼했으며, 배우자였던 사람이 노령연금 수급권자이고, 청구인이 출생연도별 지급 나이에 도달하면 받습니다. 금액은 부양가족연금을 뺀 노령연금 중 혼인기간분의 절반이 원칙입니다. 2016년 12월 30일 이후 지급사유는 협의나 재판으로 비율을 달리 정할 수 있습니다. 청구는 수급권이 생긴 때부터 5년 이내, 선청구는 이혼 효력일부터 3년 이내 1회입니다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0061M0.do"
    checkedAt: "2026-10-28T21:00:00+09:00"
    note: "5년 혼인과 균등 분할, 5년 청구는 국민연금법 제64조입니다. https://www.law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=900028945"
  - id: F2
    value: "지급 나이는 1953년부터 1956년생 61세, 1957년부터 1960년생 62세, 1961년부터 1964년생 63세, 1965년부터 1968년생 64세, 1969년생 이후 65세. 고객센터 1355. 기준일 2026-10-28."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0061M0.do"
    checkedAt: "2026-10-28T21:00:00+09:00"
