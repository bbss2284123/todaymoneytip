id: health-insurance-adjustment
facts:
  - id: F1
    value: "조정 적용 기간: 기본은 신청일이 속하는 달의 다음 달부터 그 해 12월까지. 예외: 매달 1일에 신청하면 그 달부터. 11월·12월·1월에는 그 달 1일부터 그 달 보험료 납부마감일 사이에 신청하면 그 달부터. 예시: 11.1.~12.10.(11월 보험료 납부마감일) 신청 → 11월 보험료부터 조정. 12.11.~다음 해 1.10. 신청 → 12월 보험료부터. 1.11.~2.10. 신청 → 1월 보험료부터. 12.1.~12.10.에는 적용 시작월을 11월 또는 12월 중 고를 수 있음. 10.1.~10.31. 신청 시 10월 보험료부터."
    source: "https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946867&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F2
    value: "대상: 소득이 감소 또는 증가한 지역가입자, 소득이 감소 또는 증가한 직장가입자 중 보수 외 소득월액보험료 부과대상자. 대상 소득: 사업·근로·이자·배당·연금·기타소득. 신청: 온라인(홈페이지·모바일앱 건강보험25시)은 소득이 감소한 경우만, 오프라인은 방문·우편·팩스."
    source: "https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946867&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F3
    value: "공통서류: 소득 정산부과 동의서, 신분증 앞면 사본. 증빙서류: 휴·폐업사실증명, 근로소득자의 퇴직증명서, 조정신청하는 해의 7월 1일 이후 발급된 직전연도 귀속 소득금액증명, 이자·배당·기타소득 원천징수영수증 등. 해촉(실시간 소득)으로 소득이 줄어 신청하면 증빙서류 없이 과세당국 연계 실시간 소득(RTI) 금액으로 인적용역사업소득을 조정. 공단은 2025년 9월부터 인적용역사업소득자의 실시간 소득자료를 연계."
    source: "https://www.nhis.or.kr/nhis/minwon/minwonServiceBoard.do?articleNo=10945804&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F4
    value: "정산: 매년 11월, 조정한 연도 전체(1~12월분) 보험료를 다음 해 11월 국세청 등 확인소득으로 다시 계산해 차액을 추가 부과 또는 환급. 직장가입자 연말정산과 비슷. 납부한 보험료와 비교해 차액을 계산하므로 소득이 줄었어도 보험료가 추가로 부과될 수 있음. 정산보험료는 재조정 불가. 정산보험료가 월 보험료액 이상이면 12회 이내 분할고지 신청 가능."
    source: "https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946867&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F5
    value: "신청 취소: 신청일로부터 90일 이내, 정산보험료 산정 이후에는 취소 불가. 조정 또는 정산만 따로 취소 불가. 조정·정산 신청 후 신청연도 안에 소득이 생기면 발생일부터 그 다음 달 말일까지 공단에 신고."
    source: "https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946867&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F6
    value: "유의: 조정 후 피부양자 자격을 취득하면 정산 결과에 따라 취득한 날로 상실될 수 있고, 경감·본인부담상한제 등 보험료 기준으로 받은 혜택은 환수될 수 있음. 피부양자 자격취득은 별도 신고 필요. 1~10월분은 전전년도 소득, 11~12월분은 전년도 소득으로 부과. 소득금액증명 사유는 매년 7~10월에 신청 가능."
    source: "https://www.nhis.or.kr/nhis/minwon/minwonServiceBoard.do?articleNo=10945804&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F7
    value: "국민건강보험공단 대표전화 1577-1000(유료, 평일 09시~18시)."
    source: "https://www.nhis.or.kr/nhis/minwon/minwonServiceBoard.do?articleNo=10945804&mode=view"
    checkedAt: "2026-11-14T05:40:00+09:00"
  - id: F8
    value: "공단은 11월분부터 지역가입자 건강보험료를 새로 산정해 부과(2026-11-07 발표). 11월분부터 2025년 귀속 종합소득과 2026년 6월 1일 기준 재산세 과세표준 변동분 반영. 이번 보험료는 다음 해 10월까지 1년 적용, 납부기한 12월 10일. 재산 기본공제 1억 원, 자동차 보험료 미부과. 조정 대상 소득에 이자·배당·연금·기타소득 포함, 소득이 늘었을 때도 신청 가능."
    source: "https://www.yna.co.kr/view/AKR20261106123600530"
    checkedAt: "2026-11-14T05:40:00+09:00"
