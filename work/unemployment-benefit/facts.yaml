id: unemployment-benefit
facts:
  - id: F1
    value: "구직급여는 이직일 이전 18개월의 피보험 단위기간이 180일 이상이고, 일할 의사와 능력이 있으며, 수급자격 제한 사유가 아니고, 재취업 활동을 할 때 받습니다. 실업 신고일부터 7일은 대기기간입니다. 수급기간은 이직일 다음 날부터 12개월이고, 임신 출산 육아 등으로 늘리면 4년을 넘지 않습니다."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1032426963"
    checkedAt: "2026-10-28T21:00:00+09:00"
    note: "대기 7일과 12개월, 4년은 고용보험법 제48조와 제49조입니다. https://law.go.kr/LSW/lsInfoR.do?chrClsCd=010202&efYd=20260918&lsiSeq=284449"
  - id: F2
    value: "소정급여일수. 50세 미만은 120일, 150일, 180일, 210일, 240일. 50세 이상과 장애인은 120일, 180일, 210일, 240일, 270일. 피보험기간 구간은 1년 미만, 1년 이상 3년 미만, 3년 이상 5년 미만, 5년 이상 10년 미만, 10년 이상. 이직 전 평균임금의 60%. 2026년 구직급여 1일 상한 68,100원, 하한 66,048원. 신청은 고용24. 기준일 2026-10-28."
    source: "https://www.moel.go.kr/common/downloadFile.do?bbs_id=23&bbs_seq=20260200945&file_ext=pdf&file_seq=20260201644"
    checkedAt: "2026-10-28T21:00:00+09:00"
