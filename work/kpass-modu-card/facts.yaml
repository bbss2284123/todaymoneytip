id: kpass-modu-card
facts:
  - id: F1
    value: "국토교통부 보도자료(정책브리핑 전재, 보도시점 2025. 12. 15.). 인용: \"월 15회 이상 대중교통(시내버스, 지하철, 광역버스, GTX 등)을 이용하는 경우 지출 금액의 일정 비율(20~53.3%)을 환급받을 수 있는 교통카드('24.5~)\". \"한 달 동안 환급 기준금액을 초과하여 대중교통비를 지출한 경우 초과분에 대해 모두 돌려받을 수 있는 「모두의 카드」\". \"일반형은 1회 총 이용요금(환승금액 포함)이 3천원 미만인 수단에만 적용되고, 플러스형은 모든 수단에 대해 환급이 적용된다.\" 환급 예시, 일반국민·수도권: \"모두의 카드 일반형 2.8만원(9만-6.2만), 플러스형 2만원(12만-10만)\". 기준액 표(만원): 수도권 일반 6.2/10, 청년·2자녀·어르신 5.5/9, 3자녀 이상·저소득 4.5/8. 일반 지방권 5.5/9.5, 5/8.5, 4/7.5. 우대지원지역 5/9, 4.5/8, 3.5/7. 특별지원지역 4.5/8.5, 4/7.5, 3/6.5. \"별도의 카드를 발급받을 필요없이 기존 K-패스 카드를 그대로 사용\"하고 \"사후에 K-패스 시스템에서 해당 월의 이용 금액을 합산하여 환급 혜택이 가장 큰 방식을 자동 적용\". 사례 1 서울 3자녀, 시내버스·지하철, 월 6만원: 기본형 6만원×50%=3만원, 모두의 카드 일반형 6만원-4.5만원=1.5만원, 플러스형 6만원-8만원=0원. 사례 3 청년 월 15만원은 기본형 15만원×30%=4.5만원. \"어르신(65세 이상) 유형을 신설\" \"기본형 환급률 일반 국민(어르신 포함) 20% → 어르신 유형 30%(+10%p)\". \"'26년부터 8개 기초 지자체가 새로 참여\" \"총 218개 기초 지자체\" \"아직 참여하지 않은 지자체(11곳)\". 숫자 15, 20, 53.3, 24, 5, 1, 3, 3000, 2.8, 9, 6.2, 2, 12, 10, 6, 4, 8, 9.5, 8.5, 7.5, 4.5, 3.5, 7, 6.5, 50, 0, 30, 65, 10, 218, 11, 8, 2025, 12."
    source: "https://www.korea.kr/briefing/pressReleaseView.do?newsId=156735080"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "2026-11-21에 정책브리핑 페이지와 첨부 HWPX(fileId=198299229)를 열었다. 본문 표는 이 표의 만원 칸을 원 단위 말로 옮긴 것이다. 6.2만 원=62,000원, 10만 원=100,000원, 5.5만 원=55,000원, 9만 원=90,000원, 4.5만 원=45,000원, 8만 원=80,000원, 9.5만 원=95,000원, 8.5만 원=85,000원, 5만 원=50,000원, 7.5만 원=75,000원, 4만 원=40,000원, 3.5만 원=35,000원, 7만 원=70,000원, 3만 원=30,000원, 6.5만 원=65,000원. 8개 지자체 이름과 10%p, 12만, 2만, 15만, 4.5만(청년 예시), 2025, 12, 24는 본문에 쓰지 않는다. 사례 1의 0원은 플러스 기준액 미만이라 본문 계산의 0원과 같다."
  - id: F2
    value: "한국교통안전공단 K-패스 안내. 인용: \"참여하고 있는 지자체에 주민등록주소지가 등록되어있는 만 19세 이상\". 기본형 환급비율 표: 일반 20%, 청년·어르신·2자녀는 colspan으로 30%, 3자녀 50%, 저소득 53%. \"청년기본법에 따른 만19 ~ 34세\". \"만 19세 이상의 기초생활보장법에 따른 기초생활수급자 및 차상위계층\". 모두의 카드 기준액 표는 보도자료와 같은 6.2, 10, 5.5, 9, 4.5, 8, 9.5, 8.5, 5, 7.5, 4, 3.5, 7, 6.5. \"일반형 : 3000원 미만 대중교통 이용내역 대상/ 플러스형 : 전체 이용내역 대상\". 절차: K-패스 카드발급, K-패스 App 또는 홈페이지 접속, 카드등록 및 회원가입, 카드이용. \"월 1일~말일 기준으로 대중교통 15회 이상 이용 시 3가지(기본형/일반형/플러스형) 환급 유형 중 가장 유리한 유형으로 자동 적용되어 익월 환급\". 날짜(며칠)는 없고 익월만 있다. 신용·체크 구분 문장 없음. 숫자 19, 20, 30, 50, 53, 34, 3000, 15, 1, 3."
    source: "https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "2026-11-21에 화면을 열었다. 저소득 칸은 53%로 찍혀 있다. 보도자료 범위와 티머니 표의 53.3%와 달라, 본문은 53.3%를 쓰고 53%는 공단 화면이 그렇게 보인다는 문장에만 쓴다. 환급 '일'은 이 화면에 없어 본문은 공식 안내에서 확인이라고 적는다. 바로가기 주소 korea-pass.kr 는 이 실행에서 접속이 되지 않아 그 사이트 문장은 인용하지 않는다."
  - id: F3
    value: "티머니 모두의카드 안내. 저소득 그 외 시간 53.3%. 일반 20%, 청년 만 19세~34세 30%, 어르신 노인복지법 만 65세 이상 30%, 다자녀(2자녀) 미성년 자녀를 둔 2자녀 부모 30%, 다자녀(3자녀) 미성년 자녀를 둔 3자녀 부모 50%. 기준액 표는 보도자료와 같다. \"월 15회 이상 대중교통 이용 시 환급 혜택이 적용되어요. 가입 첫 달은 15회 미만 이용 시에도 환급 혜택을 받을 수 있어요.\" \"서울 시민은 만 19세~39세까지 모두의카드 청년 할인\". \"고속/시외버스, KTX, SRT, 공항버스 등 별도로 발권받아 탑승하고, 다른 교통수단과 환승 할인이 되지 않는 교통수단은 포함되지 않아요.\" 시차출퇴근 시간 칸이 있으나 그 비율 숫자는 국토부 보도자료와 공단 표에 없어 본문에 쓰지 않는다. 신용·체크 구분 없음. 환급 날짜 없음. 숫자 53.3, 20, 19, 34, 30, 65, 2, 3, 50, 15, 39."
    source: "https://mktp.tmoney.co.kr:8523/front/kpass/kPassGuide.do?dvs=web"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "2026-11-21에 안내 화면을 열었다. 시차출퇴근 칸의 50%, 60%, 80%, 83.3%는 보도자료·공단 표와 대조되지 않아 본문 숫자로 쓰지 않는다. 기후동행카드 요금은 이 화면과 국토부 보도자료에 없어 적지 않는다."
  - id: F4
    value: "정책뉴스. 인용: \"2026년 1월 1일부터 도입되는 K-패스 정액제 '모두의 카드'\". \"일반형은 시내버스나 지하철 등 편도 3,000원 미만\". \"플러스형은 GTX나 신분당선까지\". \"시스템이 한 달 이용 금액 분석 후 가장 유리한 혜택 자동 적용\". 숫자 2026, 1, 3000."
    source: "https://www.korea.kr/news/policyNewsView.do?newsId=148957286"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "2026-11-21에 정책뉴스 본문을 열었다. 기준액 표 숫자는 이 페이지 본문에 없고 보도자료 첨부에 있다."
  - id: F5
    value: "조세특례제한법 제126조의2. 시행 2026. 9. 18. 법률 제21467호. 대중교통이용분 × 100분의 40. 2028년 12월 31일까지 제공받은 재화·용역. 환급받은 교통비를 대중교통이용분에서 뺀다는 문장은 이 조에 없다. 숫자 126, 2, 2026, 9, 18, 21467, 100, 40, 2028, 12, 31."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033516335"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "2026-11-21에 조문을 열었다. 본문에는 126, 2, 40, 2026만 쓰고 시행일 9월 18일, 법률번호, 2028, 100분의 40의 100, 12, 31은 본문에 넣지 않는다. 환급액 제외는 단정하지 않는다."
  - id: F6
    value: "2026년 세제개편안 첨부. 현행 대중교통 추가공제율 40%. 개정안: \"대중교통 사용분 추가공제를 기본공제로 일원화\". \"대중교통 추가공제 적용 종료(재정지출 전환)\". \"추가공제 한도를 100만원씩 하향\". 적용시기 \"'27.1.1. 이후 개시하는 과세기간 분부터\". 본문은 이 날을 2027년 1월 1일로 적는다. 정부 개정안이지 확정 법률이 아니다. K-패스 환급액을 사용액에서 뺀다는 문장은 이 첨부에서 찾지 못했다. 숫자 2026, 2027, 40, 100, 27, 1."
    source: "https://www.korea.kr/briefing/pressReleaseView.do?newsId=156773219"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "2026-11-21에 정책브리핑 페이지와 첨부 HWPX(fileId=198519650, 198519654)를 열었다. 본문의 2027년 1월 1일은 이 '27.1.1.이다. 한도 200만 원, 100만 원 구간의 200과 급여 7,000만 원은 본문에 쓰지 않고 100만 원씩만 쓴다."
  - id: F7
    value: "직접 계산. 수도권 일반 국민, 일반형, 15회 이상, 월 9만 원(90,000원). 정률 20% = 90,000×0.2 = 18,000원 = 1만 8천 원. 정액 90,000-62,000 = 28,000원 = 2만 8천 원. 더 큰 금액 28,000원. 3자녀 수도권 일반형 월 6만 원(60,000원). 정률 50% = 30,000원 = 3만 원. 정액 60,000-45,000 = 15,000원 = 1만 5천 원. 더 큰 금액 30,000원. 15회 미만이면 0원. 막대 길이 숫자도 18000, 28000. 보도자료 사례 2: 일반 지방권 일반 국민, 시내버스·지하철, 월 11만 원(110,000원). 정률 20% = 22,000원 = 2만 2천 원. 정액 110,000-55,000 = 55,000원 = 5만 5천 원. 숫자 15, 9, 90000, 20, 0.2, 18000, 1, 8, 62000, 28000, 2, 28, 3, 6, 60000, 50, 30000, 45000, 15000, 5, 0, 11, 110000, 22000, 55000."
    source: "https://www.korea.kr/briefing/pressReleaseView.do?newsId=156735080"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "비율과 기준액은 F1. 0.2는 20%의 소수이고 본문에는 20%만 쓴다. 28은 막대 amount 28000과 별개로 본문에 28을 쓰지 않는다. 썸네일 thumbNumber 6.2는 F1의 6.2."
  - id: F8
    value: "이 글을 확인한 날은 2026-11-21. 기준 표기 2026년 11월 21일. 숫자 2026, 11, 21."
    source: "https://www.korea.kr/briefing/pressReleaseView.do?newsId=156735080"
    checkedAt: "2026-11-21T11:00:00+09:00"
    note: "본문 확인 문장, baseDate, 출처 옆 날짜."
