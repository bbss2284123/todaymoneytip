id: pension-early-or-late
facts:
  - id: F1
    value: "가입기간 10년 이상. 1953년부터 1956년생 노령 61세 조기 56세. 1957년부터 1960년생 62세와 57세. 1961년부터 1964년생 63세와 58세. 1965년부터 1968년생 64세와 59세. 1969년생 이후 65세와 60세."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F2
    value: "조기노령연금은 한 달에 0.5%, 1년에 6%, 최대 5년이면 30%까지 줄어 평생 갑니다. 1966년생 예시는 59세 70%, 60세 76%, 61세 82%, 62세 88%, 63세 94%입니다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F3
    value: "연기연금은 국민연금법 제62조. 한 달에 1,000분의 6, 곧 0.6%이고 1년이면 7.2%입니다. 최대 5년. 연기 비율은 50%, 60%, 70%, 80%, 90%, 100% 중에서 고릅니다. 부양가족연금액은 가산 기준에서 뺍니다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1033300455"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F4
    value: "예시. 월 100만 원을 12개월 일찍 받으면 6만 원이 줄어 월 94만 원. 12개월 미루면 7만 2,000원이 늘어 월 107만 2,000원. 기준일 2026-10-28. 고객센터 1355."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    checkedAt: "2026-10-28T09:00:00+09:00"
    note: "6%와 7.2%는 공단과 법 조문 비율입니다. 100만 원은 예시 입력입니다. 1355는 보건복지부 기초연금 안내가 국민연금공단 고객센터로 적은 번호입니다. https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1488478&mid=a10503010100"
