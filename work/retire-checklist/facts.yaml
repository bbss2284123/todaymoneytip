id: retire-checklist
facts:
  - id: F1
    value: "확인할 기한만 적습니다. 퇴직금 14일. 임의계속 신청은 첫 지역보험료 납부기한에서 2개월. 노령연금 가입기간 10년. 기초연금은 만 65세 생일 달의 1개월 전. 기준일 2026-10-28."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1030452787"
    checkedAt: "2026-10-28T21:00:00+09:00"
    note: "2개월은 건강보험공단 임의계속 안내, 10년은 국민연금공단 노령연금 안내, 65세와 1개월은 정부24 기초연금 안내입니다."
