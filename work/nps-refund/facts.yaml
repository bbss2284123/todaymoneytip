id: nps-refund
facts:
  - id: F1
    value: "반납은 반환일시금을 받은 사람이 다시 가입한 뒤, 그 돈에 이자를 더해 내고 예전 가입기간을 되돌리는 일입니다. 분할은 1년 미만 3회, 1년 이상 5년 미만 12회, 5년 이상 24회입니다. 2026년 적용 이율로 공단 표는 2.2%를 적습니다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0046M0.do?menuId=MN24001115"
    checkedAt: "2026-10-28T21:00:00+09:00"
  - id: F2
    value: "고지서는 신청한 달의 다음 달 11일에서 15일경 나오고 말일까지 냅니다. 고객센터 1355. 기준일 2026-10-28. 강제 납부가 아닙니다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0046M0.do?menuId=MN24001115"
    checkedAt: "2026-10-28T21:00:00+09:00"
    note: "1355는 국민연금공단 고객센터 번호로 기초연금 보도자료에도 있습니다."
