id: nps-increase-pension
facts:
  - id: F1
    value: "노령연금은 가입기간 10년 이상이면 태어난 해의 지급개시연령 이후 평생 매월 지급. 급여수준은 기본연금액에 가입기간별 지급률을 곱하고 부양가족연금액을 더한다. 가입기간 10년 기준 50%에, 10년을 초과하는 1년마다 5%를 가산하고, 1년 미만은 매 1개월마다 5/12%를 가산한다. 실제 지급은 12개월로 나누어 매월 준다. 가입자 안내서는 가입기간이 길수록 더 많이 받는다고 적는다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "10년 50%, 초과 1년마다 5%, 1개월마다 5/12%는 노령연금 페이지 급여수준 칸. 12개월로 나눈 월 지급과 '가입기간이 길수록'는 2026 가입자 안내서 1면(발행 2026년 10월, PDF 세로 1페이지). https://www.nps.or.kr/html/download/memberGuide2026.pdf"
  - id: F2
    value: "2026년 보험료율은 9.5%이다. 2025년 9%에서 2033년 13%까지 2026년부터 매년 0.5%포인트씩 오른다. 보험료는 월 소득액에 보험료율을 곱한다. 2026년 7월 기준소득월액 하한액 41만 원, 상한액 659만 원."
    source: "https://www.nps.or.kr/html/download/memberGuide2026.pdf"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "가입자 안내서 1면 보험료율 표의 2026년 칸 9.5%, 그리고 2026년 7월 하한 41만원 상한 659만원 문장."
  - id: F3
    value: "추납은 현재 보험료로 대상 기간을 내는 제도이고 강제가 아니다. 한도는 최대 10년 미만이다. 1988년 1월 1일 이후 군복무기간을 포함해도 최대 119개월이다. 납부예외, 보험료를 한 번이라도 낸 뒤의 적용제외, 군복무기간이 대상이다. 가입자만 신청한다. 산식은 신청일이 속하는 달의 기준소득월액에 납부기한이 속하는 달의 보험료율을 곱하고, 다시 월수를 곱한다. 일시납 또는 월 단위 최대 60회 분할. 분할하면 1년 만기 정기예금 이자가 붙는다. 고지서는 신청한 달의 다음 달 11일에서 15일경, 말일까지."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0047M0.do"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "안내서 1면도 추납을 10년 미만으로 적고, 소득이 없으면 임의계속가입 신청 뒤 추납이 가능하다고 적는다. 119개월 문장은 추납 페이지."
  - id: F4
    value: "반납은 반환일시금을 받은 뒤 자격을 다시 취득한 사람이, 받았던 돈에 이자를 더해 내면 가입기간이 복원되는 제도이고 강제가 아니다. 자격 유지 중에만 신청한다. 1년 미만은 3회, 1년 이상 5년 미만은 12회, 5년 이상은 24회까지 분할한다. 2026년 반납 이율은 2.2%이다. 이율은 은행 1년 만기 정기예금 이자율을 평균한 값이다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0046M0.do"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "안내서 1면도 반납을, 반환일시금에 이자를 더하면 가입기간이 복원되어 수령액을 늘릴 수 있다고 적는다."
  - id: F5
    value: "임의계속가입은 국민연금 가입자 또는 가입자였던 사람이 60세에 도달해 자격이 사라진 뒤, 가입기간이 부족하거나 기간을 늘리려는 경우 65세에 달할 때까지 신청으로 가입하는 제도다. 65세 생일 전날까지 신청한다. 의무가 아니다. 제외는 65세 이상, 60세 도달로 반환일시금을 받은 사람, 전액 미납이나 전액 납부예외(미납은 낸 뒤 신청 가능), 노령연금을 청구해 받는 중인 사람이다. 사업장임의계속가입자는 보험료 전액이 본인 부담이고 기준소득월액의 9.5%다. 6개월 이상 보험료를 계속 미납하면 직권 탈퇴된다. 신청은 방문, 우편, 팩스, 본인 확인 전화, 홈페이지, 모바일 앱 내 곁에 국민연금. 고객센터 1355."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0032M0.do?menuId=MN24001111"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "9.5% 전액 본인부담 문장은 사업장임의계속가입자 칸. 안내서 1면은 임의계속가입자를 의무가입 연령인 만 60세를 넘긴 뒤 본인이 희망해 계속 가입한 사람으로 적는다."
  - id: F6
    value: "기타임의계속가입자와 임의가입자의 2026년 중위수 기준소득월액은 1,013,000원이다. 적용기간은 2026년 4월 1일부터 2027년 3월 31일까지다. 중위수 이상으로 이미 신고한 사람은 그 신고액을 유지한다. 임의계속 페이지의 2026년 4월 칸도 101.3만 원이다."
    source: "https://www.nps.or.kr/pnsgdnc/newgdnc/getOHAE0001M1.do?menuId=MN24000897&pstId=ZZ202600000000000268"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "공단 안내 등록일 2026-03-17. 국민연금법 시행령 제10조를 근거로 적혀 있다. 101.3만 원은 임의계속 페이지 연도표의 2026년 4월 칸과 같다."
  - id: F7
    value: "연기연금은 전부 또는 일부를 최대 5년까지 미룬다. 1개월마다 0.6%를 더해 1년당 7.2%의 연금액을 인상한다. 노령연금 수급자가 희망하면, 수급권을 취득한 이후부터 출생연도별 지급개시연령 도달일부터 5년까지다. 연기 비율은 50%, 60%, 70%, 80%, 90%, 전부다. 다시 받을 때 부양가족연금액을 제외한 원래 노령연금액에 연기된 매 1년당 7.2%(월 0.6%)를 더한다. 연금액이 늘면 연금소득세, 건강보험료, 기초연금액에 영향을 줄 수 있다. 국민연금법 제62조는 연기되는 매 1개월마다 그 금액의 1천분의 6, 곧 1,000분의 6을 더한다고 적는다. 일부 연기는 1천분의 500, 600, 700, 800, 900이다. 조문 시행일은 2026년 10월 20일, 법률 제22096호."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1033300455"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "최대 5년, 월 0.6%, 연 7.2%는 가입자 안내서 1면 노령연금 칸과 노령연금 페이지가 같다. 비율 50%부터 전부, 부양가족연금 제외, 건강보험료와 기초연금 영향 문장은 노령연금 페이지. https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do 법 제62조 ①은 60세 이상 65세 미만으로도 적혀 있다. 글의 기간 설명은 2026년 공단 안내의 최대 5년을 따른다."
  - id: F8
    value: "조기노령연금은 법 제61조. 가입기간 10년 이상, 출생연도별 조기 나이 이상, 소득이 있는 업무를 하지 않을 때 신청하면 지급개시연령 전에도 받는다. 1966년생 예시 지급률은 59세 70%, 60세 76%, 61세 82%, 62세 88%, 63세 94%다. 한 살마다 6%포인트다. 5년을 앞당기면 70%라서 30%포인트가 줄어 평생 간다. 2026년 소득이 있는 업무는 근로소득금액과 사업소득금액을 종사 개월수로 나눈 금액이 A값 3,193,511원보다 큰 경우이고, 그 기간에는 조기노령연금 지급이 정지된다."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "6과 30은 표의 차이다. 76에서 70을 빼면 6, 100에서 70을 빼면 30. 표에 100% 칸은 없고, 63세 94%의 다음 해인 정상 개시가 100%에 해당한다. 1965년부터 1968년생 노령연금 개시 64세, 조기 59세는 같은 페이지 연령표."
  - id: F9
    value: "2026년 1월 1일부터 출산 크레딧은 첫째 12개월, 둘째 12개월, 셋째부터 1명당 18개월이고 50개월 상한은 없다. 2008년 1월 1일 이후 출생하거나 입양한 자녀가 대상이고, 부모 중 1명에게 전부 또는 균분한다. 2026년 1월 1일 전에 노령연금 수급권을 취득한 사람은 출산 크레딧 종전 규정이다. 군복무 크레딧은 2026년 1월 1일 이후 복무를 마친 경우, 6개월 이상 복무하면 실제 복무기간을 최대 12개월까지 인정한다. 그 전에 복무를 마친 사람은 종전 6개월이다."
    source: "https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1488390&mid=a10503000000"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "보건복지부 보도자료 2025-12-29. 첫째 12개월, 둘째 12개월, 셋째부터 18개월, 50개월 상한 폐지, 군복무 최대 6개월에서 12개월. 안내서 1면도 2026년 1월 1일 이후 첫째, 50개월 상한 없음, 군 6개월 이상 복무 시 최대 12개월을 적는다. 수급권 취득 전과 복무를 마친 시점의 종전 적용은 국민연금공단 연금개혁 안내 응답. https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0104M0.do"
  - id: F10
    value: "예시 입력은 부양가족연금을 뺀 월 100만 원이다. 이 100만 원은 공식 예상액이 아니다. 연기 1년 7.2%는 107만 2,000원, 표기 107.2만, 막대 높이 107. 2년 14.4%는 114만 4,000원. 3년 21.6%는 121만 6,000원. 4년 28.8%는 128만 8,000원. 5년 36%는 136만 원, 증가분 36만 원. 1년 증가분 7만 2,000원. 조기 1년 6%는 94만 원, 감소분 6만 원. 2년 12%는 88만 원. 3년 18%는 82만 원. 4년 24%는 76만 원. 5년 30%는 70만 원. 확인일 2026년 11월 15일. 고객센터 1355."
    source: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    checkedAt: "2026-11-15T10:42:00+09:00"
    note: "비율은 F7과 F8의 공식이다. 100만 원만 예시 입력이다. 법 제62조의 월 0.6%와 공단 1966년생 지급률 표의 한 살 6%포인트를 그 입력에 곱했다. 손익분기나 수익률은 계산하지 않았다."
