id: housing-monthly
facts:
  - id: F1
    value: "한국주택금융공사 주택연금 월지급금 예시. 일반주택, 종신지급, 정액형. 기준일 2026-03-01. 나이 칸은 55세, 60세, 65세, 70세, 75세, 80세. 집값 칸은 1억 원부터 12억 원. 시세 12억 원을 넘는 집은 12억 원 칸까지만 봅니다. 70세, 3억 원 칸은 923,000원입니다."
    source: "https://hf.go.kr/ko/sub03/sub03_01_01_02.do"
    checkedAt: "2026-10-28T21:00:00+09:00"
    note: "923,000원은 공사 표의 70세, 3억 원 칸을 원 단위로 옮긴 값입니다. 표에 없는 나이는 추정하지 않습니다."
