id: hidden-insurance-money
facts:
  - id: F1
    value: "금융위원회 보험정책 페이지(https://www.fsc.go.kr/po010103/87270)를 2026-11-28에 열었다. 게시일 2026-07-07. 제목과 본문: 잠자고 있는 보험금 10조 3천억원. 2025년 청구건당 평균 404만원. 2025년 약 3조 2,470억원(80만건) 환급. 내보험찾아줌 누리집 cont.insure.or.kr 또는 cont.knia.or.kr. 올해에도 약 10조 3천억원. 숨은보험금 규모: 22년말 12.4조원, 23년말 12.1조원, 24년말 11.2조원, 25년말 10.3조원. 중도보험금 7조 7,667억원 / 만기보험금 1조 9,235억원 / 휴면보험금 6,237억원. 계약 만기 후 1년까지는 평균공시이율의 50%, 1년 이후 3년까지는 40%, 3년 후 0%. 7월부터 우편, 모바일 전자고지, 유선 안내. 내보험찾아줌에서 가입 내역 조회, 숨은보험금 조회·청구, 피상속인 보험계약 내역 확인. 본문·제목·설명에 쓰는 표기: 2022년 말 12.4조 원, 2023년 말 12.1조 원, 2024년 말 11.2조 원, 2025년 말 약 10조 3천억 원, 10.3조 원, 7조 7,667억 원, 1조 9,235억 원, 6,237억 원, 3조 2,470억 원, 80만 건, 404만 원, 50%, 40%, 0%, 1년, 3년, 7월. 숫자 2022, 2023, 2024, 2025, 2026, 7, 10, 10.3, 3, 404, 2470, 80, 12.4, 12.1, 11.2, 7667, 9235, 6237, 50, 40, 0, 1."
    source: "https://www.fsc.go.kr/po010103/87270"
    checkedAt: "2026-11-28T11:10:00+09:00"
    note: "2026-11-28에 정책 페이지 본문을 열었다. 담당자 전화번호는 본문에 넣지 않는다. 10.3조는 각주의 25년말 10.3조원이고, 본문 10조 3천억원과 같은 금액을 짧게 적은 것이다."
  - id: F2
    value: "금융위원회 2026-07-07 배포, 보도시점 2026-07-08 보도자료 PDF를 2026-11-28에 열었다. https://www.fsc.go.kr/comm/getFile?fileNo=2&fileTy=ATTACH&srvcId=BBSTY1&upperNo=87270 숨은보험금은 지급금액이 확정되었으나 청구되지 않은 보험금. 원인에 만기, 중도보험금, 휴면보험금, 폐업·도산 사업장의 미청구 퇴직연금 적립금. 2025년 찾아간 숨은보험금 3조 2,470억원(80만건, 1건당 약 404만원). 참고3: PC·모바일로 cont.insure.or.kr 혹은 cont.knia.or.kr 접속, 본인인증(공동인증서, 휴대폰 간편인증 등) 후 조회. 서비스는 본인 가입내역, 숨은보험금 조회·청구, 상속인 금융거래조회를 신청한 상속인의 피상속인 보험계약 확인. 참고4: 중도보험금은 계약 기간 중 조건이 되면 나오는 축하금, 교육자금, 자립자금, 건강진단자금, 생활·여행자금, 배당금, 사고분할보험금, 생존연금. 만기보험금은 만기 후 3년이 지나지 않아 소멸시효가 완성되지 않은 보험금. 중도보험금은 만기가 되면 만기보험금으로 전환. 휴면보험금은 지급사유 발생일부터 3년이 지나 소멸시효가 완성됐지만 찾아가지 않은 보험금. 참고5: 2천만원 초과, 망인 명의, 개명은 비대면 환급이 제한될 수 있음. 서민금융콜센터 국번없이 1397. 휴면예금찾아줌 sleepmoney.kinfa.or.kr, 정부24, 어카운트인포. 막대 길이는 억원 단위다. 7조 7,667억 원은 77,667억 원으로 길이 77667. 1조 9,235억 원은 19,235억 원으로 길이 19235. 6,237억 원은 길이 6237. 숫자 2026, 7, 8, 3, 2, 2470, 80, 404, 1397, 77667, 19235, 6237."
    source: "https://www.fsc.go.kr/comm/getFile?fileNo=2&fileTy=ATTACH&srvcId=BBSTY1&upperNo=87270"
    checkedAt: "2026-11-28T11:10:00+09:00"
    note: "2026-11-28에 PDF 9쪽을 열었다. 보험사 대표번호 목록과 담당자 전화번호는 본문에 넣지 않는다. 5개년 합계 19조 1,822억원과 업권별 3조 457억원, 2,013억원은 본문에 쓰지 않는다. cont.insure.or.kr 과 cont.knia.or.kr 은 이날 이 환경에서 열리지 않았다. 화면 단추 이름은 보도 원문에 있는 것만 쓴다."
  - id: F3
    value: "금융위원회 숨은보험금 조회·청구 FAQ PDF를 2026-11-28에 열었다. https://www.fsc.go.kr/comm/getFile?fileNo=4&fileTy=ATTACH&srvcId=BBSTY1&upperNo=87270 이자는 상품 약관에 따르고, 약관을 보고 찾을지 정한다. 휴면보험금은 이자가 없어 바로 찾는 편이 유리하다. 2026년 7월 현재 생명보험 표준약관 예시: 중도보험금은 지급사유 다음 날부터 만기일까지 평균공시이율, 만기일부터 1년간 평균공시이율의 50%, 만기일부터 1년 경과 후 2년간 40%. 만기보험금은 만기 후 3년까지, 1년간 50%, 그다음 2년간 40%. 휴면보험금은 이자 없음. 평균공시이율은 계약 체결 시점의 전체 보험사 공시이율 평균. 금융감독원 업무자료에서 볼 수 있다고만 적혀 있고, 이번 확인에서 이율 숫자 자체는 옮기지 않는다. 표준약관 예시이며 상품마다 다를 수 있다. 본인인증 후 24시간 이용. 생명·손해보험이 한 번에 조회되고 생존자 숨은보험금은 청구까지 된다. 망인은 상속인 금융거래조회 또는 안심상속 원스톱 신청이 된 뒤 내보험찾아줌에서 접수번호와 본인인증으로 조회. 망인 청구는 그 화면에서 안 되고 보험회사에 문의. 안심상속은 사망일이 속한 달의 말일부터 1년 이내. 대면은 시·군·구청과 읍·면·동 주민센터, 온라인은 정부24 www.gov.kr. 협회 사이트는 개인정보를 영업·홍보에 쓰지 않는다. 보험 권유 전화는 유사 사이트 의심. 보험회사 보유 휴면은 소멸시효 3년 경과 후 서민금융진흥원 출연 전까지. 출연분은 서민금융진흥원, 콜센터 1397, 정부24, 어카운트인포 등. 숫자 2026, 7, 1, 2, 3, 50, 40, 24, 1397, 0."
    source: "https://www.fsc.go.kr/comm/getFile?fileNo=4&fileTy=ATTACH&srvcId=BBSTY1&upperNo=87270"
    checkedAt: "2026-11-28T11:10:00+09:00"
    note: "2026-11-28에 FAQ PDF 3쪽을 열었다. 해지 계약이 조회되는지는 이 PDF와 보도자료에 없다. 병원비 미청구가 숨은보험금인지도 없다. 입금까지 며칠인지도 없다. 그 셋은 본문에서 확인되지 않았다고 적는다. 0%는 보도자료 본문의 3년 후 0%이고 FAQ 표의 휴면은 이자 없음이다."
  - id: F4
    value: "정부24 안심상속 원스톱 페이지(https://www.gov.kr/portal/onestopSvc/safeInheritance)를 2026-11-28에 열었다. 상속인 또는 후견인이 사망자 또는 피후견인의 금융거래, 토지, 자동차, 세금, 연금 가입 유무 등을 한 번에 조회하는 서비스. 온라인 신청자격은 1순위 상속인(자녀, 배우자)과, 1순위가 없을 때의 2순위 상속인(부모, 배우자). 1순위가 상속을 포기해서 2순위가 된 경우는 방문 신청만 가능. 온라인 순서: 안심상속 통합처리 신청, 간편인증 또는 인증서 로그인, 신청서 작성, 주민센터 확인·접수, 접수증 출력. 방문은 시·구, 읍·면·동 주민센터. 신청기한은 사망일이 속한 달의 말일부터 1년 이내. 이 페이지는 보험 계약 목록을 따로 보여 준다고 적지 않았다. 보험 계약 조회는 F3의 내보험찾아줌 접수번호 단계로 적는다. 숫자 1, 2."
    source: "https://www.gov.kr/portal/onestopSvc/safeInheritance"
    checkedAt: "2026-11-28T11:10:00+09:00"
    note: "2026-11-28에 정부24 안심상속 안내 본문을 열었다. 대기 문구와 함께 서비스 설명, 신청자격, 온라인 다섯 단계, 1년 기한이 보였다. 콜센터 번호는 본문에 넣지 않는다."
  - id: F5
    value: "이 글을 확인한 날은 2026-11-28. 기준 표기 2026년 11월 28일. 썸네일 10.3조는 F1의 2025년 말 10.3조원. 그림 막대 길이 77667, 19235, 6237은 F2의 억원 환산이다. 숫자 2026, 11, 28, 10.3, 77667, 19235, 6237."
    source: "https://www.fsc.go.kr/po010103/87270"
    checkedAt: "2026-11-28T11:10:00+09:00"
    note: "예시 계산의 100만 원, 연 2%, 1만 원, 8,000원은 WorkedExample example 안이라 본문 사실 숫자로 쓰지 않는다."
