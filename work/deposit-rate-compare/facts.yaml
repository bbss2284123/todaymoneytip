id: deposit-rate-compare
facts:
  - id: F1
    value: "금융감독원 금융상품통합비교공시 금융상품한눈에. 정기예금 화면은 저축 메뉴 안. 주소 finlife.fss.or.kr. 첫 화면 정기예금의 금융권역은 전체, 은행, 저축은행, 신협조합. 새마을금고는 이 목록에 없다. 저축 예정기간은 1개월, 3개월, 6개월, 12개월, 24개월, 36개월. 저축 금액 검색 칸의 최대는 10억 원(검색 칸 한도이지 상품 가입 한도가 아님). 가입대상: 제한없음(일반인), 서민전용(기초생활수급자 등, 상세정보의 가입대상 요건 확인), 일부제한(특정인, 상세정보의 가입대상 요건 확인). 가입방법: 전체, 영업점, 인터넷, 스마트폰, 모집인, 전화(텔레뱅킹), 기타. 우대조건: 비대면 가입, 재예치, 주거래(급여, 연금 이체 등), 첫거래, 연령, 타상품가입·실적. 단리는 원금에만 약정 이자율을 적용. 복리는 월 또는 연 단위 이자를 원금에 합산해 다음 이자를 계산. 세전 이자율은 우대조건을 반영하지 않은 기본금리. 상세정보 우대조건에 해당하면 더 높은 이자율이 될 수 있음. 표에 최고 우대금리 칸이 있고, 상세정보에 우대조건·만기 후 이자율·기타가 있다. 세전 이자율과 세후 이자율은 1년 기준이며, 만기 6개월 상품은 1년으로 환산된 이자율. 세후 이자율은 이자소득 원천징수세 15.4%(소득세 14%, 지방소득세 1.4%)를 차감한 금리. 세후 이자와 실수령액은 원 단위 절사, 복리는 월복리 가정 등 비교용 예시라 실제와 다를 수 있음. 거래조건은 수시로 바뀌고 공시가 늦을 수 있어 거래 전 해당 금융회사에 문의. 정렬 버튼 이름은 열어 본 문장에 없어 본문에 메뉴 이름으로 적지 않는다. 개별 은행·저축은행의 현재 금리는 적지 않는다."
    source: "https://finlife.fss.or.kr/finlife/svings/fdrmDpst/list.do?menuNo=700002"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 정기예금 목록과 첫 화면 https://finlife.fss.or.kr/finlife/main/main.do 를 열었다. 금융권역 문구는 첫 화면, 세전·세후·기본금리·6개월 환산·15.4% 문구는 정기예금 목록에 있다. 숫자 1, 3, 6, 10, 12, 14, 1.4, 15.4, 24, 36."
  - id: F2
    value: "저축은행중앙회 금리보기 - 정기예금. 고시 금리는 저축은행 본점 기준이고 지점별 금리는 해당 저축은행에 문의. 영업정지 저축은행 금리는 없음. 상품별 금리와 거래조건이 수시로 바뀌어 공시가 늦을 수 있으므로 저축은행에 문의. 예금 금리는 약정 이율 기준. 약정금리는 세금이 차감되지 않은 이자율. 세후금리는 이자소득 원천징수세 15.4%(소득세 14%, 지방소득세 1.4%)를 차감한 금리. 중도해지금리는 저축 예정기간과 관계없이 약정기간 12개월 상품을 6개월 경과 후 해지한 값을 대표로 기재. 세후이자(단리)는 원금에만 이자율과 기간을 곱함. 세후이자(복리)는 원금과 그 이자까지 곱함."
    source: "https://www.fsb.or.kr/mobratedepo_0100.act"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 금리보기 정기예금 화면을 열었다. 기본금리·최고금리 정의는 이 정기예금 화면에 없어 저축은행중앙회 문장으로 쓰지 않는다."
  - id: F3
    value: "전국은행연합회 소비자포털 예금 금리 비교 화면. 세후금리는 이자소득 원천징수세 15.4%(소득세 14%, 지방소득세 1.4%)를 차감한 금리. 중도해지금리는 저축 예정기간과 관계없이 12개월 기준으로 개설일로부터 6개월 경과 후 해지 시 적용되는 금리. 세후이자와 만기시 예상금액은 비교용 예시라 실수령액과 다를 수 있어 상세정보와 거래은행 확인."
    source: "https://portal.kfb.or.kr/compare/receiving_search.php"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 비교 화면을 열었다. 홈은 글자 인코딩이 깨져 메뉴 클릭 이름은 본문에 적지 않는다. 이 화면은 은행 예금 금리 비교로 두고, 저축은행·신협 범위를 이 화면의 범위로 쓰지 않는다."
  - id: F4
    value: "예금자보호 한도. 원금과 소정의 이자를 합하여 1인당 1억 원까지만 보호. 금융회사별로 1인당 1억 원. 같은 금융회사 안에서는 예금 종류별·지점별이 아니라 1인이 보호받는 총액. 예금에서 대출을 먼저 갚고 남은 예금이 기준. 이자는 약정 이자와 예금보험공사가 시중은행 1년 만기 정기예금 평균금리를 감안해 정한 이자 중 적은 금액. 1억 원을 넘는 금액은 예금보험금으로 받지 못하고, 파산 절차에서 배당받을 수 있다. 확정기여형 퇴직연금, 개인형 퇴직연금, 연금저축, 사고보험금은 일반 예금과 분리해 각각 1억 원."
    source: "https://www.kdic.or.kr/sp/dpstrprot/ProtSystProtLmts/selectScrn.do"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 보호한도 화면을 열었다. 각주의 5천만 원 문장은 보험사고 때 계약인수 안내로 읽혀, 옛 한도 숫자로 쓰지 않는다. 옛 한도는 F6."
  - id: F5
    value: "예금보험공사 FAQ. 예금보호한도 1억 원은 2025년 9월 1일부터 적용. 가입 시점과 관계없이 2025년 9월 1일 이전 가입분도 1억 원. 한도 상향 신청은 없음. 한도 상향을 이유로 개인정보를 요구하는 연락은 사기일 수 있음. 예금보험공사가 보호하는 금융회사는 은행, 보험회사, 투자매매·투자중개업자, 상호저축은행. 농·수협 지역조합, 신용협동조합, 새마을금고, 산림조합, 우체국은 개별 법령의 자체 기금으로 보호하고 예금보험공사가 보호하지 않음. 은행·저축은행 예·적금은 원금과 이자를 합쳐 1억 원. 같은 금융회사의 여러 계좌는 합산. 다른 금융회사는 각각 1억 원. 예금보험금 지급은 세전. 이자분에는 이자소득세와 주민세 등 세금을 냄. 펀드 등 운용실적에 따라 지급액이 바뀌는 상품은 보호되지 않음."
    source: "https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 FAQ를 열었다. 새마을금고·신협·우체국의 현재 보호 한도 숫자는 이 FAQ에 없어 본문에 적지 않는다. FAQ 사례의 3천만 원, 9천만 원 등 예시 금액도 본문에 넣지 않는다."
  - id: F6
    value: "예금보호한도를 5천만 원에서 1억 원으로 올리는 예금자보호법 시행령 등 개정안이 2025년 7월 22일 국무회의에서 의결되어 2025년 9월 1일부터 시행될 예정이라고 예금보험공사가 보도했다. 대상 시행령에 예금자보호법 시행령, 신용협동조합법 시행령, 새마을금고법 시행령이 포함된다. 보도 당시 문장은 상호금융 한도도 같은 날 1억 원으로 올라간다고 했다. 현재 한도가 시행 중인지는 F5의 FAQ(2025년 9월 1일부터 1억 원 적용)로 예금보험공사 보호분을 확인했다. 상호금융의 현재 한도 숫자는 시행 후 조문을 이 글에서 열지 않아 본문에 단정하지 않는다."
    source: "https://www.kdic.or.kr/di/medi/selectPbcrBbsDtl.do?bbsSeCd=bodo&cdVl=bodo&pstNo=59448"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 보도자료(등록 2025-07-22, 제목 2025년 9월 1일부터 예금을 1억 원까지 보호)를 열었다. 본문에는 5천만 원에서 1억 원, 2025년 9월 1일만 쓴다. 7월 22일, 24년, 2028년 보험료는 본문에 넣지 않는다."
  - id: F7
    value: "소득세법 제129조 제1항 제1호. 그 밖의 이자소득 원천징수세율은 100분의 14. 비영업대금의 이익은 100분의 25(온라인투자연계금융업자를 통한 이자소득은 100분의 14). 실지명의가 확인되지 않는 소득은 이 비율이 아님. 국세청 금융소득 안내도 그 밖의 이자소득은 100분의 14. 시행 2026년 1월 1일, 법률 제21221호, 2025년 12월 23일 일부개정."
    source: "https://www.law.go.kr/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=1000226044"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 조문과 국세청 페이지 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7914&mi=40359 를 열었다. 실명 미확인 90%, 45%, 38%는 본문에 숫자로 적지 않고 '실명이 아닌 이자는 이 비율이 아니에요'로만 쓴다. 비영업대금 25%도 예금 계산에 쓰지 않는다."
  - id: F8
    value: "지방세법 제103조의13 제1항. 소득세 원천징수 때 그 소득세의 100분의 10을 개인지방소득세로 함께 특별징수. 이자소득세 14%의 10%는 1.4%포인트. 14%와 1.4%를 더하면 15.4%. 금융상품한눈에, 저축은행중앙회, 은행연합회가 세후금리에서 이 15.4%를 뺀다고 적음."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033359499"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "2026-11-20에 지방세법 조문을 열었다. 시행 2026년 7월 1일, 법률 제21308호, 2025년 12월 31일 일부개정. 14의 10% = 1.4, 합 15.4. 숫자 100, 10, 14, 1.4, 15.4."
  - id: F9
    value: "직접 계산한 예시. 특정 은행 금리가 아님. 원금 1억 원(100,000,000원), 기간 1년(12개월), 금리 차이 0.4%포인트. 세전 이자 차이 = 100,000,000 × 0.4% = 400,000원 = 40만 원. 세금 15.4% = 400,000 × 0.154 = 61,600원 = 6만 1,600원. 세후 이자 차이 = 400,000 × (1 − 0.154) = 338,400원 = 33만 8,400원, 약 33만 8천 원. 단리. 원 미만은 이 곱셈에서 생기지 않음."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033359499"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "세율은 F7·F8. 0.4%포인트와 1억 원, 1년은 예시 입력. 숫자 0.4, 0.154, 1, 12, 100000000, 400000, 40, 61600, 1600, 6, 338400, 8400, 33, 8, 15.4."
  - id: F10
    value: "이 글을 확인한 날은 2026-11-20. 기준일 표기 2026-11-20. 비교 사이트는 3곳."
    source: "https://finlife.fss.or.kr/finlife/main/main.do"
    checkedAt: "2026-11-20T11:40:00+09:00"
    note: "본문 확인 문장, baseDate, 제목의 3. 숫자 2026, 11, 20, 3."
