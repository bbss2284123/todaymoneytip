id: health-voluntary
facts:
  - id: F1
    value: "임의계속가입은 퇴직 이전 18개월 동안 직장가입자 자격이 통산 1년, 곧 365일 이상인 지역가입자가 신청합니다. 개인 대표자는 제외입니다. 최대 36개월 동안 지역보험료 대신 임의계속보험료를 낼 수 있고, 피부양자를 올릴 수 있습니다."
    source: "https://www.nhis.or.kr/nhis/policy/wbhada05500m01.do"
    checkedAt: "2026-10-28T21:00:00+09:00"
  - id: F2
    value: "신청 기한은 지역가입자가 된 뒤 최초로 고지받은 지역보험료 납부기한에서 2개월이 지나기 전입니다. 보험료는 퇴직 월을 포함한 최근 12개월 보수월액 평균에 그해 직장가입자 보험료율을 곱하고 보수 외 소득월액보험료를 더합니다. 고객센터 1577-1000. 기준일 2026-10-28."
    source: "https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946871&mode=view"
    checkedAt: "2026-10-28T21:00:00+09:00"
