id: pension-savings-irp-order
facts:
  - id: F1
    value: "소득세법 제59조의3. 연금저축계좌 납입액은 연 600만 원까지, 그 금액과 퇴직연금계좌 납입액을 합하면 연 900만 원까지 세액공제합니다. 종합소득금액 4,500만 원 이하이거나 근로소득만 있는 경우 총급여 5,500만 원 이하면 100분의 15, 그 밖은 100분의 12입니다. 확인일 2026-11-23."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1034037067"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F2
    value: "같은 단서는 연금저축 납입이 없으면 퇴직연금 납입액만으로 연 900만 원까지 공제 대상으로 봅니다. 연금저축만 900만 원을 넣으면 600만 원을 넘는 금액은 없는 것으로 합니다. 소득세법 제59조의3 제1항."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1034037067"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F3
    value: "ISA 전환금액이 있으면 전환금액의 100분의 10 또는 300만 원 중 적은 금액을 기존 한도에 더합니다. 소득세법 제59조의3 제3항과 제4항."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1034037067"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F4
    value: "국세청 연금계좌 세액공제 표는 4,500만 원(총급여 5,500만 원) 이하 600만 원(900만 원) 15%, 초과 12%입니다. 퇴직연금계좌는 DC와 IRP를 포함하고 확정기여형 사용자부담금은 제외합니다. 확인일 2026-11-23."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F5
    value: "국세청 연금소득 안내. 연금계좌 납입 상한은 연 1,800만 원입니다. 일반 연금수령은 55세 이후 개시 신청, 가입일부터 5년 경과, 수령 한도 이내입니다. 이연퇴직소득만 인출하면 5년 요건은 적용하지 않습니다. ISA 만기일부터 60일 이내 납입을 적습니다. 부득이한 사유에는 3개월 이상 요양이 있습니다. 인출 순서는 과세제외 금액이 먼저입니다. 연금저축과 퇴직연금 사이 이체는 연금수령 요건 전에는 인출로 봅니다. 확인일 2026-11-23."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7885"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F6
    value: "국세청 기타소득 원천징수. 세액공제를 받은 연금납입액과 운용실적으로 늘어난 금액을 연금외수령하면 원천징수세율은 15%입니다. 확인일 2026-11-23."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7893"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F7
    value: "근로자퇴직급여 보장법 시행령 제18조. IRP 연금은 55세 이상, 지급기간 5년 이상입니다. 중도인출은 제2조의 주택구입·전세금·6개월 이상 요양·재난과, 신청일부터 5년 안의 파산·개인회생, 담보대출 상환입니다. 법 제25조 가입자는 전세금 인출이 한 사업장에서 1회이고, 의료비는 연간 임금총액의 1천분의 125를 초과할 때로 한정합니다."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1032589681"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F8
    value: "근로자퇴직급여 보장법 시행령 제2조. 담보 사유는 무주택자의 주택구입, 전세금·보증금(한 사업장 1회), 6개월 이상 요양 의료비, 5년 안의 파산·개인회생입니다. 그 사유의 담보 한도는 가입자별 적립금의 100분의 50입니다. 법 제7조는 담보 제공을 원칙적으로 금지하고 예외 한도를 대통령령에 맡깁니다."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lspttninfSeq=71008"
    checkedAt: "2026-11-23T10:52:00+09:00"
    note: "법 제7조 본문은 https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1032588729 에서 같은 날 확인했습니다. 본문 링크 pension-savings-december-31의 31은 이미 공개된 글 주소입니다."
  - id: F9
    value: "근로자퇴직급여 보장법 시행규칙 제10조. 확정기여형퇴직연금과 개인형퇴직연금은 가입자별 전체 적립금의 100분의 70까지 위험자산에 투자합니다. 위험자산은 지분증권입니다. 확인일 2026-11-23."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=001000&lsNm=%EA%B7%BC%EB%A1%9C%EC%9E%90%ED%87%B4%EC%A7%81%EA%B8%89%EC%97%AC%EB%B3%B4%EC%9E%A5%EB%B2%95%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&mode=10"
    checkedAt: "2026-11-23T10:52:00+09:00"
  - id: F10
    value: "금융감독원 통합연금포털은 퇴직연금 중도인출을 원칙적으로 제한하고 예외 사유를 적습니다. 연금수령 요건으로 55세와 가입 5년을 적고, 추가 적립금의 연금 외 수령 칸에 기타소득세 16.5%를 적습니다. 확인일 2026-11-23."
    source: "https://www.fss.or.kr/fss/main/contents.do?menuNo=201003"
    checkedAt: "2026-11-23T10:52:00+09:00"
    note: "100lifeplan.fss.or.kr 첫 화면은 같은 날 접속이 500으로 끝났습니다. 포털 본문은 금융감독원 통합연금포털 메뉴에서 확인했습니다."
  - id: F11
    value: "2026년 세제개편안 상세본은 15세부터 34세 청년의 퇴직연금 납입 공제율을 15%로 하자는 개정안입니다. 적용 시기로 2027년 1월 1일 이후 납입분을 적습니다. 공포된 법률이 아닌 정부안입니다. 확인일 2026-11-23."
    source: "https://mofe.go.kr/com/cmm/fms/FileDown.do?atchFileId=ATCH_000000000032335&fileSn=6"
    checkedAt: "2026-11-23T10:52:00+09:00"
    note: "본문은 15, 34, 15, 2026만 씁니다. 2027은 원장에만 둡니다."
