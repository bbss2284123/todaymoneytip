id: year-end-tax-refund-december
facts:
  - id: F1
    value: "소득세의 과세기간은 1월 1일부터 12월 31일까지 1년이다. 확인일 2026-11-15."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1029489919"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "소득세법 제5조 제1항. 법률 제21221호, 시행 2026년 7월 1일. 2026-11-15에 조문을 열었다. 썸네일 12.31은 12월 31일이다. 13월의 월급은 환급을 부르는 말이지 법령 용어가 아니다."
  - id: F2
    value: "연금계좌 납입액의 12%. 종합소득금액 4,500만 원 이하, 근로소득만 있으면 총급여 5,500만 원 이하는 15%. 연금저축은 연 600만 원, 퇴직연금과 합치면 연 900만 원. 한도를 넘는 금액은 없는 것으로 한다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1021863203"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "소득세법 제59조의3 제1항. work/pension-savings-december-31/facts.yaml F2를 재사용. 그 원장은 2026-11-14에 같은 조문을 열었다."
  - id: F3
    value: "총급여 5,500만 원 이하 예시에서 연금저축 추가 납입 300만 원의 15%는 45만 원. 지방소득세는 이 곱셈에 넣지 않는다. 300만 원은 연금저축 600만 원 한도 안에 있다고 둔 예시이다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1021863203"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "공제율 15%와 한도 600만 원은 F2의 재사용 조문. 45만 원은 300만 원에 15%를 곱한 값이다."
  - id: F4
    value: "신용카드등사용금액이 총급여액의 25%를 넘으면 그 초과분에 소득공제. 신용카드 15%, 직불카드·현금영수증 30%, 전통시장 40%, 대중교통 40%. 2028년 12월 31일까지 쓴 금액. 기본 한도는 연 250만 원, 총급여 7,000만 원 이하는 연 300만 원. 자녀등 1명은 7,000만 원 이하 350만 원, 그 밖 275만 원. 자녀등 2명 이상은 7,000만 원 이하 400만 원, 그 밖 300만 원."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033516335"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "조세특례제한법 제126조의2 제1항, 제2항, 제10항. 법률 제21467호, 시행 2026년 9월 18일. 2026-11-15에 조문을 열었다. 한도 문장은 https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1032251007 에도 있다."
  - id: F5
    value: "신용카드 등 소득공제 기본한도를 자녀 수에 따라 늘리고, 2026년 1월 1일 이후 지출분부터 적용한다. 총급여 7,000만 원 이하는 자녀 없음 300만 원, 1명 350만 원, 2명 이상 400만 원. 7,000만 원 초과는 250만 원, 275만 원, 300만 원."
    source: "https://whatsnew.mofe.go.kr/mec/ots/dif/view.do?comBaseCd=DIFTYPCD&difField1=DIFFIELD05&difSer=a4949398-2661-4119-8503-a5da5336cfa8&temp=2026&temp2=HALF001"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "재정경제부 이렇게 달라집니다. 2026년 하반기 금융·재정·조세. 2026-11-15에 열었다. 금액은 F4 조문과 같다."
  - id: F6
    value: "총급여 7,000만 원 이하이고 그해 주택이 없는 세대의 세대주 또는 배우자가 2028년 12월 31일까지 주택청약종합저축에 넣은 돈. 연 300만 원 한도, 100분의 40. 300만 원의 40%는 120만 원. 공제를 받으려면 다음 해 2월 말까지 무주택 확인서. 예외가 아닌 중도해지는 그해 납입을 공제하지 않는다. 추징은 납입액의 6%."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033071451"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "조세특례제한법 제87조 제2항, 제4항, 제7항. 시행 2026년 9월 18일. 2026-11-15에 조문을 열었다. 120만 원은 300만 원에 40%를 곱한 값."
  - id: F7
    value: "조세특례제한법 제58조. 고향사랑 기부금 10만 원 이하는 기부금 × 110분의 100. 10만 원 초과 20만 원 이하는 10만 원 × 110분의 100 + 넘는 금액 × 40%. 20만 원 초과 2,000만 원 이하는 거기에 더해 20만 원을 넘는 금액 × 15%. 특별재난지역에 선포일부터 대통령령이 정하는 기간 안에 낸 그 초과분은 30%. 10만 원의 110%는 11만 원. 세액공제는 그해 종합소득산출세액이 한도."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033239667"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "조세특례제한법 제58조 제1항, 제2항. 법률 제21467호, 시행 2026년 9월 18일. 개정 표시 2024. 12. 31., 2025. 3. 14., 2025. 12. 23. 2026-11-15에 조문을 열었다. 11만 원은 10만 원에 110/100을 곱한 값."
  - id: F8
    value: "월세액 세액공제. 무주택 세대의 세대주, 총급여 8,000만 원 이하. 종합소득금액 7,000만 원 초과는 제외. 공제율 15%. 총급여 5,500만 원 이하이고 종합소득금액 4,500만 원 초과가 아니면 17%. 월세액 한도 연 1,000만 원. 주소를 달리하는 배우자도 요건을 갖추면 추가. 두 사람 합계가 1,000만 원을 넘으면 넘는 금액은 뺀다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1030621287"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "조세특례제한법 제95조의2. 시행 2026년 9월 18일. 제2항 배우자 추가는 2025. 12. 23. 신설. 2026-11-15에 조문을 열었다. 전문은 https://law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1023584391"
  - id: F9
    value: "정부안. 2026년 세제개편안은 월세 세액공제 한도를 연 1,000만 원에서 1,200만 원으로 올리자고 한다. 15세부터 34세는 소득과 상관없이 17%, 2029년 12월 31일까지. 적용 시기는 2027년 1월 1일 이후 지급하는 월세. 국회를 통과한 법이 아니다."
    source: "https://mofe.go.kr/com/cmm/fms/FileDown.do?atchFileId=ATCH_000000000032335&fileSn=6"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "재정경제부 2026년 세제개편안 자료. 2026년 8월 3일 18시 이후 보도용. 조특법 제95조의2 개정안 표. 2026-11-15에 파일을 열었다."
  - id: F10
    value: "간소화에서 제공하지 않거나 빠지는 자료는 직접 받아 회사에 낸다. 정책브리핑은 학원비, 월세, 기부금 영수증 일부를 미제공으로 적는다. 안경 구입비 한도는 이 원장에 숫자를 적지 않는다."
    source: "https://www.korea.kr/news/policyNewsView.do?newsId=148958686"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "국세청 자료, 정책브리핑 2026-01-28. 2026-11-15에 열었다. 기사 문장을 그대로 베끼지 않는다. 1월 20일은 그 기사의 지난 일정으로 보고 이 글의 청구 숫자로 쓰지 않는다."
  - id: F11
    value: "부양가족 자료제공 동의 경로. 홈택스, 장려금·연말정산·기부금, 연말정산간소화, 부양가족 자료제공동의 신청. 성인 본인인증은 즉시. 만 19세가 되기 전에는 미성년 자녀 신청으로 부모가 조회. 성년이 되면 다시 동의. 동의는 필수가 아니고, 가족 중 한 사람에게만 연결된다."
    source: "https://call.nts.go.kr/call/qna/selectHomeQnaInfo.do?mi=12984"
    checkedAt: "2026-11-15T05:40:00+09:00"
    note: "국세청 자주묻는Q&A 자료제공 동의. 2026-11-15에 열었다. 만 19세, 본인인증 즉시, 한 사람에게만 동의."
