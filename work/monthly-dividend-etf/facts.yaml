id: monthly-dividend-etf
facts:
  - id: F1
    value: "소득세법 제129조 제1항 제2호 나목. 그 밖의 배당소득 원천징수세율은 100분의 14. 출자공동사업자 배당은 100분의 25라 이 글의 세율로 쓰지 않는다. 시행 2026년 7월 1일, 법률 제21221호."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1032881117"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "같은 날 국세청 금융소득 원천징수 안내도 그 밖의 배당소득을 100분의 14로 적는다. https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7914&mi=6478 국세청 화면의 실지명의 미확인 38%와 조문 제2항의 45%는 서로 달라 본문에 넣지 않는다."
  - id: F2
    value: "국세청 2026년 3월 9일 보도참고. 이자와 배당을 합쳐 연 2,000만 원 이하면 14%로 분리과세하고, 2,000만 원을 넘으면 다른 소득과 합쳐 6%에서 45%로 종합과세한다. 지방세는 별도라고 적는다. 고배당기업 주식 배당의 분리과세는 2026년 1월 1일 이후 지급분이고, ETF 분배금이라는 말은 없다."
    source: "https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1349597"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "분리과세 구간 세율 20%, 25%, 30%와 3억 원, 50억 원, 280만 원 계산식은 ETF 적용을 확인하지 못해 본문에 넣지 않는다. 2027년, 2030년도 본문에 넣지 않는다."
  - id: F3
    value: "소득세법 제14조 제3항 제6호. 이자소득과 배당소득의 합계액이 2,000만 원 이하이면서 제127조에 따라 원천징수된 소득은 종합소득과세표준에 합산하지 않는다. 출자공동사업자 배당은 이 제외에서 빠진다. 원천징수되지 않은 소득은 이 문장의 제외에 들어가지 않는다. 시행 2026년 1월 1일, 법률 제21221호."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=001400&lsNm=%EC%86%8C%EB%93%9D%EC%84%B8%EB%B2%95&mode=11"
    checkedAt: "2026-11-27T11:30:00+09:00"
  - id: F4
    value: "지방세법 제103조의13 제1항. 소득세 원천징수 때 그 소득세의 100분의 10을 개인지방소득세로 함께 특별징수한다. 배당소득세 14%의 10%는 1.4%포인트다. 14%와 1.4%를 더하면 15.4%다. 1에서 15.4%를 뺀 비율은 0.846이다. 시행 2026년 7월 1일."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033359499"
    checkedAt: "2026-11-27T11:30:00+09:00"
  - id: F5
    value: "소득세법 제17조 제1항 제5호. 국내 또는 국외에서 받는 대통령령으로 정하는 집합투자기구로부터의 이익은 배당소득이다. 어떤 분배금이 그 이익인지는 이 조문만으로 상품마다 단정하지 않는다. 시행 2026년 1월 1일."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=001700&lsNm=%EC%86%8C%EB%93%9D%EC%84%B8%EB%B2%95&mode=11"
    checkedAt: "2026-11-27T11:30:00+09:00"
  - id: F6
    value: "조세특례제한법 제91조의18. 이자·배당 합계는 비과세 한도까지 소득세를 매기지 않고, 넘는 금액은 100분의 9이며 종합소득에 합산하지 않는다. 한도는 조건에 맞으면 400만 원, 아니면 200만 원이다. 400만 원 조건에는 직전 총급여 5,000만 원 이하, 종합소득금액 3,800만 원 이하가 있다. 소득세 원천징수는 계약 해지일에 한다. 9%의 10%는 0.9%포인트라 합치면 9.9%다. 시행 2026년 9월 18일."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033258305"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "연간 납입한도 계산식은 이번 조문 화면에서 수식이 잘려 본문에 숫자를 쓰지 않는다. 외국 집합투자증권은 운용 재산 목록에서 제외된다."
  - id: F7
    value: "조세특례제한법 일부개정법률안 제2218258호. 강명구의원 등 13인, 2026년 4월 10일 발의. 재정경제기획위원회 소위 2026년 11월 19일 상정. 공포된 법률이 아니다. 본문에는 국회 심사 중이라는 한 줄만 쓴다."
    source: "https://opinion.lawmaking.go.kr/gcom/nsmLmSts/out/2218258/detailRP"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "제안이유가 적는 현행 납입한도 연 2,000만 원, 총 1억 원과 개정안 연 6,000만 원, 총 3억 원, 비과세 600만 원, 1,200만 원은 본문에 넣지 않는다. 13인, 4월 10일, 제2218258호도 본문에 넣지 않는다."
  - id: F8
    value: "조세특례제한법 제104조의27. 요건을 갖춘 고배당기업의 주식을 보유한 거주자가 그 고배당기업으로부터 받는 배당소득 중 대통령령으로 정하는 금액은 종합소득과세표준에 합산하지 않는다. 이번에 연 조문과 국세청 보도참고에는 ETF 분배금이라는 말이 없다. 해당 여부는 본문에서 공식 안내 확인으로만 쓴다. 시행 2026년 9월 18일, 본조신설 2025년 12월 23일."
    source: "https://law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1032247707"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "2028년 12월 31일, 배당성향 100분의 40은 조문에 보였으나 ETF 적용이 확인되지 않아 본문에 넣지 않는다. 2025년 12월 23일도 본문에 넣지 않는다."
  - id: F9
    value: "국민건강보험공단 피부양자 인정기준. 모든 소득을 합하여 연간 2,000만 원 이하. 사업·금융·연금·근로기타소득이 그 합계에 들어간다. 재산세 과세표준 5억 4,000만 원 이하, 5억 4,000만 원 초과 9억 원 이하는 연간 소득 1,000만 원 이하. 이 1,000만 원은 금융소득만의 기준이 아니다."
    source: "https://www.nhis.or.kr/nhis/policy/wbhada07400m01.do"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "사업소득 500만 원, 형제자매 재산 1억 8,000만 원, 장애인 예외는 이 화면에 있으나 이 글의 본문에는 넣지 않는다."
  - id: F10
    value: "국민건강보험공단이 올린 국민건강보험법 시행규칙 제44조 제1항. 소득세법 제14조 제3항 제6호에 따른 소득이 1,000만 원 이하이면 해당 이자소득과 배당소득은 소득월액에 합산하지 않는다. 직장 보수 외 소득과 지역 소득월액 산정에 같이 적힌 단서다."
    source: "https://www.nhis.or.kr/lm/lmxsrv/law/lawLinkContentView.do?LINKCODE=c004400000&SEQ=29"
    checkedAt: "2026-11-27T11:30:00+09:00"
  - id: F11
    value: "국세청 연금소득 안내. 연금계좌의 운용실적에 따라 증가된 금액은 연금수령 때 연금소득으로 과세하고, 연금외수령 때는 기타소득으로 과세한다고 적는다. ETF 분배금이 들어오는 달의 세율은 이 안내가 따로 적지 않는다."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7885&mi=6449"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "55세, 가입 5년, 연 1,800만 원 납입 한도는 이 안내에 있으나 이 글의 본문에는 넣지 않는다. 나이별 연금수령 세율 숫자는 이번에 연 제129조 본문에서 표 칸이 비어 본문에 넣지 않는다."
  - id: F12
    value: "세후 월 50만 원은 연 600만 원. 15.4%를 뺀 비율 0.846으로 나누면 세전 7,092,199원이고 약 709만 원이다. 분배율은 가정 4%, 5%, 6%, 7%다. 만 원 반올림 원금은 1억 7,730만 원, 1억 4,184만 원, 1억 1,820만 원, 1억 132만 원. 그래프는 1.77억, 1.42억, 1.18억, 1.01억. 막대 길이 177, 142, 118, 101. 썸네일 숫자 1.42억. 확인일 2026-11-27."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1032881117"
    checkedAt: "2026-11-27T11:30:00+09:00"
    note: "세율만 법령이다. 4%, 5%, 6%, 7%는 상품 분배율이 아닌 계산 가정이다. 7,092,199는 6,000,000을 0.846로 나눈 뒤 원 단위 반올림이다. 원금은 그 금액을 분배율로 나눈 뒤 원 단위 반올림하고, 표는 만 원 단위로 다시 반올림했다."
