id: isa-maturity-pension
facts:
  - id: F1
    value: "개인종합자산관리계좌의 계약기간이 만료된 날부터 60일 이내에 잔액의 전부 또는 일부를 연금계좌로 납입한 경우가 전환입니다. 소득세법 시행령 제118조의2."
    source: "https://law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1028334881"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F2
    value: "전환금액의 10% 또는 300만 원 중 적은 금액을 기존 연금계좌 세액공제 한도에 더합니다. 직전 과세기간과 해당 과세기간에 걸쳐 넣으면 300만 원에서 직전 과세기간에 적용한 금액을 뺍니다. 소득세법 제59조의3."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1021863203"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F3
    value: "연금저축계좌는 연 600만 원, 퇴직연금계좌와 합하면 연 900만 원까지 세액공제합니다. 종합소득금액 4,500만 원 이하이거나 근로소득만 있는 경우 총급여 5,500만 원 이하면 15%, 그 밖은 12%입니다. 소득세법 제59조의3."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1021863203"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F4
    value: "종합소득 개인지방소득세 신고서 작성방법은 소득세 세액공제액의 10%를 지방소득세 세액공제로 적습니다. 소득세 15%에 그 금액의 10%를 더하면 16.5%이고, 소득세 12%는 같은 방식으로 13.2%입니다."
    source: "https://www.law.go.kr/LSW/flDownload.do?flSeq=164944863"
    checkedAt: "2026-11-22T06:00:00+09:00"
    note: "15%와 12%는 소득세법 제59조의3입니다. 16.5와 13.2는 그 공제액에 지방소득세 10%를 더한 비율입니다. 지방세법 조문 머리말은 2025년 12월 31일 공포입니다."
  - id: F5
    value: "비과세 한도는 직전 총급여 5,000만 원 이하이거나 종합소득 3,800만 원 이하 등 조건에 맞으면 400만 원, 아니면 200만 원입니다. 한도를 넘는 이자·배당은 소득세 9%이고 종합소득에 합산하지 않습니다. 조세특례제한법 제91조의18."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033258305"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F6
    value: "연간 납입한도는 2,000만 원 × [1 + 가입 후 경과한 연수, 4년 이상이면 4년] − 누적 납입금액입니다. 총납입한도는 1억 원입니다. 계약기간은 3년 이상입니다. 조세특례제한법 제91조의18."
    source: "https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033258305"
    checkedAt: "2026-11-22T06:00:00+09:00"
    note: "계산식은 법령 본문 수식의 대체 글자입니다. 2천만원 × [1 + 가입후경과한연수(경과한연수가4년이상인경우에는4년으로한다)] - 누적납입금액."
  - id: F7
    value: "연금계좌 일반 납입한도는 연 1,800만 원입니다. 전환금액은 그 한도와 따로, 만기일 잔액까지 넣을 수 있습니다. 소득세법 시행령 제40조의2."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=004002&lsNm=%EC%86%8C%EB%93%9D%EC%84%B8%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&mode=10"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F8
    value: "같은 해에 넣은 전환금액은 과세제외금액 인출 순서에서 제2호입니다. 한도 이내 납입액은 다음 과세기간 개시일부터 세액공제를 받은 금액으로 봅니다. 소득세법 시행령 제40조의3."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=004003&lsNm=%EC%86%8C%EB%93%9D%EC%84%B8%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&mode=10"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F9
    value: "국세청은 ISA 전환금액 추가한도를, 만기 잔액을 연금계좌에 납입한 해에만 적용한다고 적습니다. 확인일 2026-11-22."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F10
    value: "2026년 9월 1일 한국금융신문은, 정부가 확정한 세제개편안에서 ISA 계약기간과 납입한도 이월을 현행으로 두었다고 전합니다. 국회 통과 문장은 그 기사에 없습니다."
    source: "https://www.fntimes.com/html/view.php?ud=202609011613272775179ad43907_18"
    checkedAt: "2026-11-22T06:00:00+09:00"
  - id: F11
    value: "의원안은 납입한도를 연 6,000만 원, 총 3억 원으로, 비과세를 600만 원과 1,200만 원으로 올리자는 내용입니다. 2026년 11월 19일 소위에 상정된 기록이고 공포된 법률은 아닙니다."
    source: "https://opinion.lawmaking.go.kr/gcom/nsmLmSts/out/2218258/detailRP"
    checkedAt: "2026-11-22T06:00:00+09:00"
