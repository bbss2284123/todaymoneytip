id: housing-qualify
facts:
  - id: F1
    value: "공사 월지급금 예시의 나이 칸은 55세, 60세, 65세, 70세, 75세, 80세입니다. 집값 칸은 12억 원까지이고, 시세가 12억 원을 넘으면 12억 원 칸까지만 봅니다. 표 기준일은 2026년 3월 1일, 곧 2026-03-01입니다. 글의 확인일은 2026-10-28입니다."
    source: "https://hf.go.kr/ko/sub03/sub03_01_01_02.do"
    checkedAt: "2026-10-28T21:00:00+09:00"
    note: "가입 연령의 법령 문장과 중도해지 수수료는 이 표에 없어 적지 않습니다."
