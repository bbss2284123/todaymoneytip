id: credit-card-deduction-december
facts:
  - id: F1
    value: "신용카드등사용금액 연간합계액이 총급여액의 100분의 25(최저사용금액)를 넘을 때 공제. 국외 사용 금액은 제외. 2028년 12월 31일까지 사용분. 대상: 신용카드, 현금영수증, 직불카드·선불카드(실명 확인된 것) 등."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033516335"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "조세특례제한법 제126조의2 제1항. 법률 제21467호, 시행 2026. 9. 18. 2026-11-16에 조문을 열었다."
  - id: F2
    value: "공제율: 신용카드 15%, 현금영수증·직불(체크)·선불카드 30%, 전통시장 40%, 대중교통 40%, 도서·신문·공연·박물관·미술관·영화관·체육시설(총급여 7,000만 원 이하) 30%."
    source: "https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11898&mi=1318"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "국세청 자주묻는Q&A 27. 신용카드 등 사용액, 공제율 표. 조특법 제126조의2 제2항 제1~5호와 같다."
  - id: F3
    value: "최저사용금액(총급여 25%)은 신용카드사용분에서 먼저 뺀다. 최저사용금액이 신용카드사용분 이하이면 빼는 금액은 최저사용금액 × 15%. 그래서 25%를 이미 신용카드로 넘긴 뒤에 쓰는 돈은 신용카드 15%, 체크카드·현금영수증 30%가 된다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033516335"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "조특법 제126조의2 제2항 제6호 가·나목. 나목: 최저사용금액이 신용카드사용분보다 크면 신용카드사용분×15% + (최저사용금액−신용카드사용분)×30%."
  - id: F4
    value: "기본공제 한도: 총급여 7,000만 원 이하 연 300만 원(자녀등 1명 350만 원, 2명 이상 400만 원), 7,000만 원 초과 연 250만 원(자녀등 1명 275만 원, 2명 이상 300만 원). 2026년 1월 1일 이후 지출분부터. 적용기한 2028년 12월 31일까지 3년 연장."
    source: "https://whatsnew.mofe.go.kr/mec/ots/dif/view.do?comBaseCd=DIFTYPCD&difField1=DIFFIELD05&difSer=a4949398-2661-4119-8503-a5da5336cfa8&temp=2026&temp2=HALF001"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "재정경제부 이렇게 달라집니다(2026 하반기). 같은 금액이 조특법 제126조의2 제10항(https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1032251007, 개정 2025. 12. 23.)에 있다. 2026-11-16에 둘 다 열었다. 2025년 한도는 자녀 수와 무관하게 300만/250만(국세청 Q&A)."
  - id: F5
    value: "추가공제(기본 한도를 넘은 경우): 전통시장+대중교통 사용분 공제액 합계 연 200만 원 한도, 총급여 7,000만 원 이하는 문화체육사용분까지 합쳐 연 300만 원 한도."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033516335"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "조특법 제126조의2 제11항 제1호(신설 2025. 12. 23.). 국세청 Q&A 2025 한도표(7천만 이하 300+300, 초과 250+200)와 같다."
  - id: F6
    value: "가족 합산: 연간소득금액 100만 원 이하(근로소득만 있으면 총급여 500만 원 이하)인 배우자·직계존비속 사용액 포함. 직계존비속은 나이 요건 없이 소득 요건만(예: 55세 모친). 형제자매는 제외. 맞벌이 부부는 합산 불가, 각자 공제. 가족카드는 카드 명의자(사용자) 기준."
    source: "https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11898&mi=1318"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "국세청 Q&A 27. 60세 미만 무소득 부모도 생계를 같이하면 가능."
  - id: F7
    value: "할부는 구입 시점 기준(예: 11월 30일 6개월 할부 구입 → 전액 그해 공제). 해외 사용분 제외. 국세·지방세, 전기·수도·가스·전화·인터넷 요금, 아파트관리비, TV시청료, 도로통행료(하이패스) 제외. 신차 구입 제외, 중고차는 구입금액의 10%만 포함. 면세점 사용분 제외. 보장성보험료·기부금은 카드로 내도 카드 공제 안 됨. 의료비는 의료비 세액공제와 카드 공제 둘 다 됨. 체크카드 결제는 현금영수증을 따로 받지 않는다(체크카드 사용분으로 공제)."
    source: "https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11898&mi=1318"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "국세청 Q&A 27 공제시기·공제 O/X·중복공제 항목. 입사 전·퇴사 후 사용분은 공제 안 됨, 휴직 기간은 됨."
  - id: F8
    value: "정부안(국회 심사 중): 2026년 세제개편안은 대중교통 사용분 추가공제(40%)를 기본공제로 일원화(일반 공제율 적용)하고, 도서·공연 등 추가공제는 총급여 요건 없이 적용, 추가공제 한도를 100만 원씩 낮춰 총급여 7,000만 원 이하 200만 원, 초과 100만 원으로 하자고 한다. 2027년 1월 1일 이후 개시하는 과세기간부터. 기본공제 한도는 그대로. 2026년 사용분에는 해당하지 않는다."
    source: "https://www.mofe.go.kr/com/cmm/fms/FileDown.do?atchFileId=ATCH_000000000032335&fileSn=8"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "재정경제부 2026년 세제개편안 자료 p.68 '(1) 신용카드등 소득공제 합리화 등(상세본 p.132)' 개정 내용 문구. 발표 2026-08-03, 정책브리핑 https://www.korea.kr/briefing/pressReleaseView.do?newsId=156773219 (페이지는 열었으나 박스에서 첨부 PDF 직접 내려받기는 TLS 오류로 실패, 원문 텍스트는 재정경제부 파일 색인본으로 확인). 적용 시기 문구는 MTN 2026-08-03 보도(https://news.mtn.co.kr/news-detail/2026080315521251297)로 보충. 국회 통과는 확인 못함 → '정부안(국회 심사 중)'으로만 쓴다. 공식 원문에서 적용 시기 숫자를 직접 못 본 부분은 '2027년 사용분부터(정부안)'까지만 쓴다."
  - id: F9
    value: "종합소득 기본세율: 과세표준 1,400만 원 이하 6%, 1,400만~5,000만 원 15%, 5,000만~8,800만 원 24%, 8,800만~1억 5,000만 원 35%."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7880&mi=6444"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "국세청 기본세율 표. 지방소득세는 이 run에서 출처를 열지 못해 계산에 넣지 않는다(본문엔 '지방소득세 별도'로만)."
  - id: F10
    value: "예시(직접 계산): 총급여 5,000만 원 → 25% 문턱 1,250만 원. 3,000만 원 → 750만 원, 7,000만 원 → 1,750만 원. 신용카드만 1,500만 원: 1,500×15% − 1,250×15% = 37만 5천 원 공제. 12월 100만 원을 체크카드로(신용 1,400만 + 체크 100만): 1,400×15% + 100×30% − 1,250×15% = 52만 5천 원. 차이 15만 원. 세율 15% 구간이면 소득세 약 2만 2,500원 줄어듦(지방소득세 별도). 둘 다 기본 한도 300만 원 안. 100만 원을 신용카드로 쓰면 공제 15만 원, 체크카드로 쓰면 30만 원."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033516335"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "F1·F3 산식과 F9 세율로 직접 계산. 1,500만 원·100만 원은 예시 입력. 과세표준이 15% 구간이라는 가정을 본문에 적는다. 공제 차이 15만 원에 15%를 곱하면 2만 2,500원이다."
  - id: F11
    value: "사용액 확인: 홈택스 연말정산간소화에서 일괄 조회, 현금영수증 사용내역은 홈택스 계산서·영수증·카드 → 현금영수증 → 근로자·소비자 조회/변경 → 현금영수증 사용내역(소득공제) 조회. 전통시장 가맹점 여부는 홈택스 상담·불복·제보 → 기타 → 전통시장 정보 조회."
    source: "https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11898&mi=1318"
    checkedAt: "2026-11-16T05:35:00+09:00"
    note: "국세청 Q&A 27 현금영수증 조회방법·전통시장 항목. 2026년 연말정산 미리보기 개통일은 이 run에서 확인 안 함 → 날짜 쓰지 않는다. 카드사 앱 메뉴 이름은 회사마다 달라 특정하지 않는다."
