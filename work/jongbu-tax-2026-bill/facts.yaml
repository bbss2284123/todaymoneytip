id: jongbu-tax-2026-bill
facts:
  - id: F1
    value: "국세청 보도참고자료. 작성일자 2026.09.10. 보도 시점 2026. 9. 10. Q1 올해 종합부동산세 정기분 고지서는 11월 22일경 발송될 예정이며, 납부기간은 12월 1일부터 12월 15일까지. 합산배제·과세특례 신청은 9월 16일부터 9월 30일까지, 신청하면 11월 정기고지에 반영. 1세대 1주택 특례 적용 시 기본공제 12억 원, 미적용 시 9억 원. 세액공제 합계 최대 80%. 연령 60세 이상 65세 미만 20%, 65세 이상 70세 미만 30%, 70세 이상 40%. 보유기간 5년 이상 10년 미만 20%, 10년 이상 15년 미만 40%, 15년 이상 50%. 과세기준일 6월 1일, 본문에는 2026.6.1.로도 적힘. 홈택스 경로는 로그인 후 화면 하단 세무 업무 가이드맵에서 종합부동산세. 상담은 국번 없이 126. 종합부동산세 상담은 음성ARS 또는 보이는 ARS 2번 다음 1번. 손택스 간이세액계산 경로는 적혀 있으나 고지 상세내역의 손택스 메뉴 이름은 이 글의 조회 순서로 쓰지 않는다."
    source: "https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1354762"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "2026-11-21에 안내 원문을 열었다. 발송은 11월 22일경 예정으로만 쓴다. 숫자 2026, 9, 10, 11, 22, 12, 1, 15, 16, 30, 6, 80, 60, 65, 20, 70, 30, 40, 5, 50, 2, 126."
  - id: F2
    value: "국세청 2026년 12월 세무일정. 12월 15일 종합부동산세 납부기한, 비고 2026년 귀속. 같은 화면은 신고·납부 기한일이 공휴일·토요일 또는 근로자의 날이면 그다음 날을 기한으로 한다고 적는다. 2026년 11월 세무일정에는 종합부동산세 고지서 발송일이 없다. 12월 15일은 화요일이다."
    source: "https://www.nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=&taxMonth=12&taxYear=2026"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "2026-11-21에 12월 일정과 11월 일정 https://www.nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=&taxMonth=11&taxYear=2026 을 열었다. 다른 세목의 날짜는 본문에 넣지 않는다. 숫자 2026, 12, 15, 11."
  - id: F3
    value: "국세청 종합부동산세 신고납부기한 페이지. 과세기준일 매년 6월 1일. 납부기간 매년 12월 1일부터 12월 15일. 주택분 과세표준은 공시가격 합계에서 9억 원, 1세대 1주택자는 12억 원을 뺀 금액에 공정시장가액비율 60%를 곱한다. 1세대 1주택자 세액공제 한도 80%. 연령 60세 이상 20%, 65세 이상 30%, 70세 이상 40%. 보유 5년 이상 20%, 10년 이상 40%, 15년 이상 50%. 분납은 납부할 세액이 250만 원 초과, 농어촌특별세 제외, 납부기한 경과일로부터 6개월 이내. 페이지 문장은 250만 원 초과 500만 원 미만은 250만 원 초과금액, 500만 원 초과는 50% 이하. 신용카드 납부는 고지 금액 1,000만 원, 페이지 문장 1천만원, 농어촌특별세 포함까지. 신용카드 수수료 0.7%, 체크카드 수수료 0.4%는 납세자 부담. 같은 페이지에 2026년 8월 20일 요약표 파일 이름이 있다. 파일 본문은 열지 않아 그 파일 속 숫자를 쓰지 않는다."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7739&mi=2325"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "2026-11-21에 페이지를 열었다. 세율 구간과 재산세 공정시장가액비율 43에서 45, 세부담상한 150은 본문에 넣지 않는다. 숫자 6, 1, 12, 15, 9, 60, 80, 20, 65, 30, 70, 40, 5, 10, 50, 250, 500, 1000, 0.7, 0.4, 2026, 8."
  - id: F4
    value: "종합부동산세법 제9조. 시행 2026년 1월 1일. 1세대 1주택자 공제는 공제율 합계 100분의 80의 범위에서 중복 적용. 과세기준일 현재 만 60세 이상, 해당 주택을 과세기준일 현재 5년 이상 보유. 특례 주택분에 해당하는 산출세액은 공제 대상에서 빼는 구조가 조문에 있다."
    source: "https://www.law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=900640437"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "2026-11-21에 조문을 열었다. 표 칸의 비율 숫자는 화면에서 빠지고 국세청 안내의 표로 확인했다. 법률 호수는 본문에 넣지 않는다. 숫자 9, 2026, 1, 100, 80, 60, 5."
  - id: F5
    value: "종합부동산세법 제20조. 납부할 세액이 250만 원을 초과하면 대통령령으로 정하는 세액의 일부를 납부기한이 지난 날부터 6개월 이내에 분납. 시행령 제16조. 시행 2026년 10월 1일. 250만 원 초과 500만 원 이하이면 그 세액에서 250만 원을 뺀 금액. 500만 원을 초과하면 그 세액의 100분의 50 이하. 분납은 납부기한까지 신청서를 관할세무서장에게 제출. 세무서장은 기한까지 낼 고지와 분납기간에 낼 고지로 나눠 수정 고지."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=001600&lsNm=%EC%A2%85%ED%95%A9%EB%B6%80%EB%8F%99%EC%82%B0%EC%84%B8%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&mode=11"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "2026-11-21에 시행령 제16조와 법 제20조 https://www.law.go.kr/LSW/lsLinkProc.do?efYd=20261008&joNo=002000&lsNm=%EC%A2%85%ED%95%A9%EB%B6%80%EB%8F%99%EC%82%B0%EC%84%B8%EB%B2%95&mode=11 를 열었다. 딱 500만 원은 시행령의 이하를 따른다. 숫자 20, 250, 6, 16, 2026, 10, 1, 500, 100, 50."
  - id: F6
    value: "정부민원 110 안내. 홈택스 로그인 후 화면 하단 세무 업무 가이드맵에서 종합부동산세, 그다음 과세물건 및 세액 상세내역 조회. 고지서 QR로도 접속할 수 있다고 적혀 있다. 홈택스가 어려우면 관할세무서에서 본인 확인 후 같은 내역을 받는다. 문의는 국세청 국세상담센터 국번 없이 126."
    source: "https://www.110.go.kr/data/counselView.do?curPage=7&num=A01_717149&scCate1=&scCate2=&scIntt=&scText=&scType="
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "2026-11-21에 안내를 열었다. 작성일 숫자는 본문에 넣지 않는다. 숫자 110, 126."
  - id: F7
    value: "국세청 공제율을 더한 표. 직접 합산. 60세 20%와 5년 20%는 40%. 60세 20%와 10년 40%는 60%. 60세 20%와 15년 50%는 70%. 65세 30%와 5년 20%는 50%. 65세 30%와 10년 40%는 70%. 65세 30%와 15년 50%는 80%. 70세 40%와 5년 20%는 60%. 70세 40%와 10년 40%는 80%. 70세 40%와 15년 50%는 90%이고 한도 80%라 80%만 적용. 비율의 출처는 F1과 F3."
    source: "https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1354762"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "합산만 이 항목. 숫자 60, 20, 5, 40, 10, 70, 15, 50, 65, 30, 80, 90."
  - id: F8
    value: "분납 예시. 특정 고지서가 아님. 400만 원은 250만 원 초과 500만 원 이하. 400만 원에서 250만 원을 빼면 150만 원. 기한까지 내는 금액은 250만 원. 600만 원은 500만 원 초과. 600만 원의 50%는 300만 원. 나중에 내는 금액은 300만 원 이하. 세율은 F5."
    source: "https://www.law.go.kr/LSW/lsLinkProc.do?joNo=001600&lsNm=%EC%A2%85%ED%95%A9%EB%B6%80%EB%8F%99%EC%82%B0%EC%84%B8%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&mode=11"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "숫자 400, 250, 500, 150, 600, 50, 300."
  - id: F9
    value: "이 글을 확인한 날은 2026-11-21. 기준일 표기 2026-11-21. 제목의 2026, 11월 22일경."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7739&mi=2325"
    checkedAt: "2026-11-21T05:40:00+09:00"
    note: "본문 확인 문장과 baseDate. 숫자 2026, 11, 21, 22."
