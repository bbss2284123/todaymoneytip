id: severance-tax
facts:
  - id: F1
    value: "근속연수공제. 5년 이하 100만 원 곱하기. 10년 이하 500만 원 더하기 200만 원. 20년 이하 1,500만 원 더하기 250만 원. 20년 초과 4,000만 원 더하기 300만 원."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7880&mi=6444"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F2
    value: "환산급여공제. 800만 원 이하 전액. 7,000만 원 이하 800만 원 더하기 60%. 1억 원 이하 4,520만 원 더하기 55%. 3억 원 이하 6,170만 원 더하기 45%. 3억 원 초과 15,170만 원 더하기 35%."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7880&mi=6444"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F3
    value: "기본세율 구간 1,400만 원 6%, 5,000만 원 15%, 8,800만 원 24%, 1억 5,000만 원 35%. 누진공제 126만 원, 576만 원, 1,544만 원."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7880&mi=6444"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F4
    value: "소득세법 제129조 제5호의3. 연금 실제 수령연차 10년 이하 70%, 10년 초과 20년 이하 60%, 20년 초과 50%. 10년 이하로 받으면 일시금으로 낼 퇴직소득세의 30%를 덜 냅니다. 70%만 내기 때문입니다."
    source: "https://www.law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsId=001565&lsJoLnkSeq=1000821176&print=print"
    checkedAt: "2026-10-28T09:00:00+09:00"
  - id: F5
    value: "예시 입력 퇴직소득 1억 원 100,000,000원, 근속 20년. 환산은 12개월로 펼칩니다. 소득세 1,120,000원 곧 112만 원. 70%를 곱하면 784,000원 곧 78만 4,000원. 기준일 2026-10-28. 국세청 전화 126."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7880&mi=6444"
    checkedAt: "2026-10-28T09:00:00+09:00"
    note: "112만 원과 78만 4,000원은 국세청 계산 구조에 예시 입력을 넣어 직접 계산했습니다. 지방소득세는 넣지 않았습니다."
  - id: F6
    value: "국세청 연금소득 안내. 이연퇴직소득을 연금으로 받으면 분리과세이고, 세율은 연금 외 수령 세율의 70%, 10년 초과 20년 이하는 60%, 20년 초과는 50%입니다. 세액공제 납입금과 운용수익을 연금으로 받는 합계가 연 1,500만 원 이하면 분리과세 또는 종합과세를 고릅니다. 1,500만 원을 넘으면 종합과세 또는 15% 분리과세를 고릅니다. IRP 등 연금계좌에서 퇴직소득 원금과 세액공제·운용수익은 과세 칸이 다릅니다."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7888&mi=6608"
    checkedAt: "2026-10-28T12:00:00+09:00"
    note: "1,500만 원 선택 규정은 국세청 연금소득 페이지와 소득세법 제14조 안내가 같습니다. https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7889&mi=6609"
