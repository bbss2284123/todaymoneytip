id: pension-savings-december-31
facts:
  - id: F1
    value: "소득세의 과세기간은 1월 1일부터 12월 31일까지 1년으로 한다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1029489919"
    checkedAt: "2026-11-14T10:50:00+09:00"
    note: "소득세법 제5조 제1항. 법률 제21221호, 시행 2026년 7월 1일 조문. 확인일 2026-11-14."
  - id: F2
    value: "연금계좌 납입액의 100분의 12. 종합소득금액이 4,500만 원 이하(근로소득만 있는 경우에는 총급여액 5,500만 원 이하)인 거주자는 100분의 15. 연금저축계좌에 납입한 금액이 연 600만 원을 초과하는 금액은 없는 것으로 하고, 그 600만 원 이내와 퇴직연금계좌 납입액을 합한 금액이 연 900만 원을 초과하면 그 초과액은 없는 것으로 한다. 공제 대상에서 빼는 돈은, 소득세가 원천징수되지 않은 퇴직소득 등 과세가 이연된 소득과, 연금계좌에서 다른 연금계좌로 이전하며 납입되는 금액이다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1021863203"
    checkedAt: "2026-11-14T10:50:00+09:00"
    note: "소득세법 제59조의3 제1항 원문. 법률 제21221호, 시행 2026년 7월 1일."
  - id: F3
    value: "ISA 만기 잔액을 연금계좌로 납입하면 그 납입액을 납입한 날이 속하는 과세기간의 연금계좌 납입액에 포함한다. 전환금액의 100분의 10 또는 300만 원 중 적은 금액만큼 세액공제 한도가 늘고, 그 추가 한도는 납입한 해만 적용된다."
    source: "https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1021863203"
    checkedAt: "2026-11-14T10:50:00+09:00"
    note: "소득세법 제59조의3 제3항과 제4항. 국세청도 같은 문장으로 적는다. https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875"
  - id: F4
    value: "연금계좌 납입 상한은 연간 1,800만 원. 일반 연금수령은 가입자가 55세 이후 연금수령 개시를 신청하고, 가입일부터 5년이 지난 뒤 인출하는 것이다."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7885&mi=6449"
    checkedAt: "2026-11-14T10:50:00+09:00"
    note: "국세청 연금소득 안내의 납입요건과 연금수령 요건. 확인일 2026-11-14."
  - id: F5
    value: "국세청 예시. 연금저축 600만 원과 퇴직연금 300만 원을 합하면 공제 대상 900만 원. 연금저축만 900만 원이면 공제 대상은 600만 원. 퇴직연금만 900만 원이면 공제 대상은 900만 원. 확정기여형 퇴직연금의 회사부담액은 공제 대상이 아니고, 근로자가 추가 납입한 금액은 공제 대상이다. 세액공제를 받지 못한 금액은 금융회사에 전환을 신청하면 신청한 날에 다시 납입한 것으로 보아 공제할 수 있다."
    source: "https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11905&mi=1318"
    checkedAt: "2026-11-14T10:50:00+09:00"
    note: "자주묻는Q&A 34. 연금계좌세액공제. 한도 표, DC 회사부담액, 전환특례(소득세법시행령 제118조의3)."
  - id: F6
    value: "국세청 표의 공제율로 계산한 소득세. 600만 원의 15%는 90만 원. 900만 원의 15%는 135만 원. 600만 원의 12%는 72만 원. 900만 원의 12%는 108만 원. 지방소득세를 더한 합산 비율은 이 원장에 적지 않는다."
    source: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875"
    checkedAt: "2026-11-14T10:50:00+09:00"
    note: "국세청 표는 4.5천만 원(5.5천만 원) 이하 15%, 초과 12%, 한도 600만 원(900만 원). 곱셈은 그 비율로 계산한 값. 확인일 2026-11-14."
